<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Duty Roster 🇮🇶</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1a1c20;
            --light: #2a2d34;
            --shadow: #0d0e11;
            --accent: #fbbf24;
            --crimson: #e11d48;
            --emerald: #10b981;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: #94a3b8;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        /* --- MAIN OUTER CONTAINER — SPACIOUS --- */
        .embossed-card {
            position: relative;
            background: var(--bg);
            border-radius: 4rem;
            padding: 3rem 2.5rem;
            box-shadow: 24px 24px 80px var(--shadow), -16px -16px 56px var(--light);
            z-index: 10;
            transition: all 0.7s ease;
            outline: 1px solid rgba(148, 163, 184, 0.06);
            outline-offset: 0px;
            width: 100%;
            max-width: 540px;
            margin: 0 auto;
        }
        .embossed-card::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 4rem;
            border: 1px solid rgba(148, 163, 184, 0.04);
            pointer-events: none;
            z-index: 5;
        }
        .breathing {
            animation: frameBreath 4s infinite ease-in-out;
        }
        @keyframes frameBreath {
            0%, 100% { box-shadow: 24px 24px 80px var(--shadow), -16px -16px 56px var(--light); }
            50% { box-shadow: 18px 18px 60px var(--shadow), -12px -12px 40px var(--light), 0 0 60px rgba(251, 191, 36, 0.12); }
        }

        .tube-container {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 20;
            width: 100%;
            height: 100%;
        }
        #tube-bg {
            fill: none;
            stroke: rgba(251, 191, 36, 0.03);
            stroke-width: 4;
        }
        #tube-fluid {
            fill: none;
            stroke: var(--accent);
            stroke-width: 5;
            stroke-linecap: round;
            filter: drop-shadow(0 0 12px var(--accent));
            stroke-dasharray: 500 1200;
            stroke-dashoffset: 1700;
            opacity: 0;
            transition: opacity 0.4s;
        }
        .loading-active #tube-fluid {
            opacity: 1;
            animation: seamlessFlow 2s linear infinite;
        }
        @keyframes seamlessFlow {
            from { stroke-dashoffset: 1700; }
            to { stroke-dashoffset: 0; }
        }

        .recessed-input {
            background: var(--bg);
            border-radius: 2rem;
            box-shadow: inset 10px 10px 20px var(--shadow), inset -6px -6px 16px var(--light);
            position: relative;
        }

        .password-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            padding: 0.8rem 1.5rem;
            min-height: 4.5rem;
            direction: ltr;
        }

        .password-dot {
            width: 1.4rem;
            height: 1.4rem;
            border-radius: 50%;
            background: rgba(251, 191, 36, 0.08);
            border: 2px solid rgba(251, 191, 36, 0.06);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform: scale(0.5);
            opacity: 0;
            position: relative;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        .password-dot.active {
            background: var(--accent);
            border-color: var(--accent);
            transform: scale(1.2);
            opacity: 1;
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.3), 0 0 60px rgba(251, 191, 36, 0.08), inset 0 2px 4px rgba(255,255,255,0.15);
            animation: dotPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes dotPop {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.4); opacity: 1; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        .password-dot.active::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2px solid rgba(251, 191, 36, 0.15);
            animation: rippleDot 0.6s ease-out;
        }

        @keyframes rippleDot {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(1.8); opacity: 0; }
        }

        .password-dot.filled {
            background: var(--accent);
            border-color: var(--accent);
            transform: scale(1);
            opacity: 1;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.12), inset 0 2px 4px rgba(255,255,255,0.1);
        }

        .password-dot.filled::after {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            border: 2px solid rgba(251, 191, 36, 0.06);
            animation: pulseFilled 2s ease-in-out infinite;
        }

        @keyframes pulseFilled {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.3); opacity: 0.2; }
        }

        .password-dot.empty {
            transform: scale(0.5);
            opacity: 0;
        }

        .password-dot.error-shake {
            animation: shakeError 0.5s ease;
            border-color: var(--crimson);
            background: var(--crimson);
            box-shadow: 0 0 30px rgba(225, 29, 72, 0.3);
        }

        @keyframes shakeError {
            0%, 100% { transform: translateX(0) scale(1); }
            15% { transform: translateX(-10px) scale(1.05); }
            30% { transform: translateX(10px) scale(1.05); }
            45% { transform: translateX(-6px) scale(1.02); }
            60% { transform: translateX(6px) scale(1.02); }
            80% { transform: translateX(-3px) scale(1); }
        }

        .password-input-overlay {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: text;
            z-index: 5;
        }
        .password-input-overlay input {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: transparent;
            caret-color: var(--accent);
            font-size: 1px;
            letter-spacing: 1px;
            padding: 0;
            margin: 0;
            cursor: text;
            text-align: center;
        }
        .password-input-overlay input::selection {
            background: transparent;
        }

        .cursor-indicator {
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 3px;
            background: var(--accent);
            border-radius: 50%;
            animation: cursorPulse 1.2s ease-in-out infinite;
            opacity: 0;
            transition: opacity 0.3s ease;
            box-shadow: 0 0 10px rgba(251, 191, 36, 0.3);
        }
        .cursor-indicator.visible {
            opacity: 1;
        }
        @keyframes cursorPulse {
            0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.3; }
            50% { transform: translateX(-50%) scale(3); opacity: 1; }
        }

        .embossed-btn {
            background: #2a2d34;
            border-radius: 2rem;
            box-shadow: 
                0 10px 0 #0d0e11,
                14px 14px 28px var(--shadow), 
                -10px -10px 24px var(--light);
            transition: all 0.12s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: #94a3b8;
            font-weight: 800;
            border: none;
            cursor: pointer;
            padding: 1.2rem 1.8rem;
            width: 100%;
            text-align: center;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
            position: relative;
            transform: translateY(0);
        }
        .embossed-btn:active {
            box-shadow: 
                0 3px 0 #0d0e11,
                8px 8px 16px var(--shadow), 
                -6px -6px 14px var(--light);
            transform: translateY(7px);
        }
        .embossed-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: 
                0 8px 0 #0d0e11,
                12px 12px 24px var(--shadow), 
                -8px -8px 20px var(--light);
        }

        .fetched-active {
            background: var(--accent) !important;
            color: #1a1c20 !important;
            box-shadow: 
                0 10px 0 #b08830,
                14px 14px 28px var(--shadow), 
                -10px -10px 24px var(--light),
                0 0 40px rgba(251, 191, 36, 0.4) !important;
        }
        .fetched-active:active {
            box-shadow: 
                0 3px 0 #b08830,
                8px 8px 16px var(--shadow), 
                -6px -6px 14px var(--light),
                0 0 30px rgba(251, 191, 36, 0.3) !important;
            transform: translateY(7px);
        }

        .crimson-warning {
            background: var(--crimson) !important;
            color: white !important;
            box-shadow: 
                0 10px 0 #8a1428,
                14px 14px 28px var(--shadow), 
                -10px -10px 24px var(--light),
                0 0 40px rgba(225, 29, 72, 0.4) !important;
            animation: quickShake 0.3s cubic-bezier(.36,.07,.19,.97) both;
        }
        .crimson-warning:active {
            box-shadow: 
                0 3px 0 #8a1428,
                8px 8px 16px var(--shadow), 
                -6px -6px 14px var(--light),
                0 0 30px rgba(225, 29, 72, 0.3) !important;
            transform: translateY(7px);
        }
        @keyframes quickShake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            30%, 70% { transform: translate3d(4px, 0, 0); }
            40%, 60% { transform: translate3d(-4px, 0, 0); }
        }

        #shield {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 100;
            transition: opacity 0.5s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
        }
        #shield .shield-spinner {
            width: 3rem;
            height: 3rem;
            border: 3px solid rgba(251, 191, 36, 0.06);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #shield .shield-text {
            color: rgba(251, 191, 36, 0.3);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .hidden { display: none !important; }
        .toast-error {
            background: rgba(225, 29, 72, 0.06);
            border: 1px solid rgba(225, 29, 72, 0.1);
            border-radius: 1.2rem;
            padding: 0.9rem 1.2rem;
            font-size: 0.75rem;
            color: #f1948a;
            text-align: center;
            animation: slideDown 0.4s ease;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .toggle-remember {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            font-size: 0.75rem;
            color: rgba(148, 163, 184, 0.4);
            cursor: pointer;
            user-select: none;
            transition: color 0.3s ease;
            margin-top: 6px;
        }
        .toggle-remember:hover {
            color: rgba(148, 163, 184, 0.6);
        }
        .toggle-remember input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 1.3rem;
            height: 1.3rem;
            background: #2a2d34;
            border-radius: 6px;
            cursor: pointer;
            position: relative;
            border: 1px solid rgba(148, 163, 184, 0.1);
            transition: all 0.2s ease;
            flex-shrink: 0;
        }
        .toggle-remember input[type="checkbox"]:checked {
            background: var(--accent);
            border-color: var(--accent);
        }
        .toggle-remember input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #1a1c20;
            font-size: 0.9rem;
            font-weight: 900;
        }
        .toggle-remember input[type="checkbox"]:hover {
            border-color: rgba(148, 163, 184, 0.2);
        }

        .view-wrapper {
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .view-wrapper.exit {
            opacity: 0;
            transform: translateY(-20px) scale(0.97);
        }
        .view-wrapper.enter {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .hidden-view { display: none !important; }

        .status-text {
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            color: rgba(148, 163, 184, 0.3);
            transition: all 0.4s ease;
            text-transform: uppercase;
        }
        .status-text.ready {
            color: rgba(16, 185, 129, 0.5);
            animation: blinkReady 1.2s ease-in-out infinite;
        }
        .status-text.error {
            color: rgba(225, 29, 72, 0.5);
        }
        @keyframes blinkReady {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .engraved-text {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(201, 184, 154, 0.35);
            text-shadow: 
                0 1px 0 rgba(255, 255, 255, 0.04),
                0 -1px 0 rgba(0, 0, 0, 0.25);
            padding: 0.6rem 0 0.3rem 0;
            margin-top: 0.7rem;
            border-top: 1px solid rgba(148, 163, 184, 0.04);
            text-align: center;
        }

        /* ============================================================
           ROSTER CARDS — PERFECT SPACING, MEDIUM SPECIALTY, LARGE NAME
           ============================================================ */
        .roster-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-height: 58vh;
            overflow-y: auto;
            padding: 0.25rem 0.1rem;
        }
        .roster-grid::-webkit-scrollbar {
            width: 4px;
        }
        .roster-grid::-webkit-scrollbar-track {
            background: transparent;
        }
        .roster-grid::-webkit-scrollbar-thumb {
            background: rgba(251, 191, 36, 0.2);
            border-radius: 4px;
        }

        /* CARDS WITH PROPER SPACING — NOT TOUCHING THE EDGES */
        .roster-card {
            background: #2a2d34;
            border-radius: 2rem;
            padding: 1.4rem 1.6rem 1.2rem;
            box-shadow: 
                0 8px 0 #0b0c0f,
                0 12px 28px rgba(0,0,0,0.7),
                0 4px 12px rgba(0,0,0,0.4),
                0 0 0 1px rgba(255,255,255,0.02);
            transition: all 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(148, 163, 184, 0.05);
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            transform: translateY(0);
        }
        .roster-card:hover {
            transform: translateY(-3px) scale(1.005);
            border-color: rgba(251, 191, 36, 0.13);
            box-shadow: 
                0 10px 0 #0b0c0f,
                0 18px 36px rgba(0,0,0,0.8),
                0 6px 14px rgba(0,0,0,0.5),
                0 0 0 1px rgba(251, 191, 36, 0.03);
        }
        .roster-card:active {
            transform: translateY(4px) scale(0.99);
            box-shadow: 
                0 4px 0 #0b0c0f,
                0 10px 22px rgba(0,0,0,0.7),
                0 3px 8px rgba(0,0,0,0.3);
        }

        /* Header: Specialty — MEDIUM SIZE, centered, glowing */
        .roster-card .card-header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding-bottom: 0.1rem;
        }
        .roster-card .resident-spec {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent);
            background: rgba(251, 191, 36, 0.06);
            padding: 0.2rem 1.2rem;
            border-radius: 100px;
            border: 1px solid rgba(251, 191, 36, 0.08);
            letter-spacing: 0.04em;
            text-shadow: 
                0 0 20px rgba(251, 191, 36, 0.3),
                0 0 40px rgba(251, 191, 36, 0.1),
                0 2px 4px rgba(0,0,0,0.4);
            box-shadow: 
                0 0 30px rgba(251, 191, 36, 0.05),
                inset 0 0 30px rgba(251, 191, 36, 0.02);
            transition: all 0.3s ease;
        }
        .roster-card:hover .resident-spec {
            text-shadow: 
                0 0 30px rgba(251, 191, 36, 0.5),
                0 0 60px rgba(251, 191, 36, 0.2),
                0 2px 4px rgba(0,0,0,0.4);
            box-shadow: 
                0 0 40px rgba(251, 191, 36, 0.08),
                inset 0 0 40px rgba(251, 191, 36, 0.03);
        }

        /* Middle: Resident name — LARGE FONT, embossed 3D */
        .roster-card .resident-name {
            font-size: 1.6rem;
            font-weight: 800;
            color: #f0ece4;
            letter-spacing: 0.02em;
            text-align: center;
            padding: 0.3rem 0;
            text-shadow: 
                0 4px 0 #0b0c0f,
                0 8px 20px rgba(0,0,0,0.6),
                0 2px 4px rgba(0,0,0,0.3);
            line-height: 1.2;
            word-break: break-word;
        }

        /* Phone number — smaller, subtle */
        .roster-card .resident-phone {
            font-size: 0.8rem;
            font-weight: 700;
            color: #94a3b8;
            font-family: monospace;
            direction: ltr;
            unicode-bidi: isolate;
            text-align: center;
            opacity: 0.6;
            margin-top: -0.1rem;
        }

        /* Bottom: Action buttons */
        .roster-card .card-actions {
            display: flex;
            gap: 0.6rem;
            margin-top: 0.3rem;
        }
        .roster-card .action-btn-sm {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 0.6rem 0.7rem;
            border-radius: 1.2rem;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.6rem;
            letter-spacing: 0.02em;
            white-space: nowrap;
            background: #1a1c20;
            box-shadow: 
                0 5px 0 #0d0e11,
                0 8px 18px rgba(0,0,0,0.5),
                0 3px 6px rgba(0,0,0,0.3);
            color: #94a3b8;
            transition: all 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: translateY(0);
            border: none;
            cursor: pointer;
        }
        .roster-card .action-btn-sm:active {
            transform: translateY(4px);
            box-shadow: 
                0 1px 0 #0d0e11,
                0 4px 12px rgba(0,0,0,0.5),
                0 1px 4px rgba(0,0,0,0.2);
        }
        .roster-card .action-btn-sm.call {
            color: #60a5fa;
            border: 1px solid rgba(96, 165, 250, 0.08);
        }
        .roster-card .action-btn-sm.wa {
            color: var(--emerald);
            border: 1px solid rgba(16, 185, 129, 0.08);
        }
        .roster-card .action-btn-sm.call:hover {
            background: rgba(96, 165, 250, 0.04);
        }
        .roster-card .action-btn-sm.wa:hover {
            background: rgba(16, 185, 129, 0.04);
        }

        .empty-state {
            text-align: center;
            padding: 2.5rem 1rem;
            color: rgba(148, 163, 184, 0.2);
            font-size: 0.9rem;
            font-weight: 600;
        }
        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 0.75rem;
            opacity: 0.3;
        }

        @media (max-width: 480px) {
            .embossed-card {
                padding: 2rem 1.2rem;
                border-radius: 3rem;
                max-width: 100%;
            }
            .roster-card {
                padding: 1rem 1.2rem 1rem;
                border-radius: 1.6rem;
            }
            .roster-card .resident-name {
                font-size: 1.3rem;
            }
            .roster-card .resident-spec {
                font-size: 0.75rem;
                padding: 0.15rem 1rem;
            }
        }
    </style>
</head>
<body>

    <div id="shield">
        <div class="shield-spinner"></div>
        <span class="shield-text">Iraqi Hosp. Duty Portal</span>
    </div>

    <div id="main-card" class="embossed-card breathing">
        <svg class="tube-container" viewBox="0 0 384 512" preserveAspectRatio="none">
            <rect id="tube-bg" x="2" y="2" width="380" height="508" rx="48" />
            <rect id="tube-fluid" x="2" y="2" width="380" height="508" rx="48" />
        </svg>

        <!-- LOGIN VIEW -->
        <div id="login-view" class="view-wrapper">
            <div class="text-center mb-8">
                <h1 class="text-white text-3xl font-extrabold tracking-tight">Duty Roster</h1>
                <div class="flex items-center justify-center gap-2 mt-4">
                    <span id="status-text" class="status-text">جاري التحميل...</span>
                </div>
            </div>
            <div class="space-y-8">
                <div class="recessed-input p-3" id="passwordContainer">
                    <div class="password-container" id="dotContainer">
                        <div class="password-dot empty" id="dot0"></div>
                        <div class="password-dot empty" id="dot1"></div>
                        <div class="password-dot empty" id="dot2"></div>
                        <div class="password-dot empty" id="dot3"></div>
                        <div class="password-dot empty" id="dot4"></div>
                        <div class="password-dot empty" id="dot5"></div>
                        <div class="password-dot empty" id="dot6"></div>
                        <div class="password-dot empty" id="dot7"></div>
                        <div class="cursor-indicator" id="cursorIndicator"></div>
                    </div>
                    <div class="password-input-overlay">
                        <input type="password" id="pw" inputmode="numeric" maxlength="8" 
                               autofocus
                               onkeydown="handlePasswordKey(event)"
                               oninput="handlePasswordInput()"
                               onfocus="showCursor()"
                               onblur="hideCursor()">
                    </div>
                </div>

                <button id="entry-btn" onclick="handleEntry()" class="embossed-btn w-full py-7 tracking-widest uppercase" disabled>جاري التحميل...</button>
                
                <div class="flex items-center justify-center px-1">
                    <label class="toggle-remember">
                        <input type="checkbox" id="rememberMe" checked>
                        <span>تذكرني</span>
                    </label>
                    <span class="text-[0.55rem] tracking-widest ml-3" style="color: rgba(251, 191, 36, 0.12);">✦ SECURE</span>
                </div>
                
                <div id="login-error" class="hidden toast-error"></div>
            </div>
            <p class="engraved-text">By Dr. MOHAMMED RIYADH</p>
        </div>

        <!-- ROSTER VIEW -->
        <div id="roster-view" class="hidden-view view-wrapper">
            <div class="text-center mb-5">
                <h2 class="text-white text-xl font-extrabold tracking-tight">📋 Today's Duty</h2>
                <p id="roster-date" class="text-[0.7rem] text-slate-500 mt-1 font-bold tracking-wider uppercase"></p>
                <p id="roster-count" class="text-[0.65rem] text-amber-500/60 mt-1 font-bold tracking-wider"></p>
            </div>
            
            <div id="roster-container" class="roster-grid">
                <!-- Roster cards will be rendered here -->
            </div>

            <div class="mt-5 text-center">
                <button onclick="logout()" class="text-[0.65rem] text-slate-500 hover:text-slate-300 underline-offset-2 underline transition-colors">تسجيل الخروج</button>
            </div>
            <p class="engraved-text">By Dr. MOHAMMED RIYADH</p>
        </div>
    </div>

<script>
    // ############################################################
    // ROSTER FUNCTIONALITY - Password animation, Remember Me, 8-digit PIN
    // ############################################################

    const CONFIG = { user: "mHub96", repo: "BTH", path: "data.json" };
    const _pt1 = "ghp_dAUtsFhTH";
    const _pt2 = "a2KeJQOsxsC";
    const _pt3 = "Ct1vz8z1Z63";
    const _pt4 = "Am sjS";
    const GH_TOKEN = (_pt1 + _pt2 + _pt3 + _pt4).replace(/\s/g, '');

    const arabicSpecs = {
        "MF": "جراحة الوجه و الفكين", "M": "الباطنية", "P": "النفسية", "G": "النسائية و التوليد",
        "GS": "الجراحة العامة", "US": "جراحة المسالك البولية",
        "ENT": "الأذن و الأنف و الحنجرة", "OR": "الكسور", "Pe": "الاطفال", "NM": "طب الجملة العصبية", "N": "طب امراض الكلى",
        "ICU": "تخدير العناية المركزة", "OP": "تخدير العمليات",
        "R": "الأشعة و السونار","O": "العيون", "D": "الوفيات"
    };

    let db = { names: [], schedule: [] };
    let dataLoaded = false;
    let loadError = false;

    const STORAGE_KEY = 'duty_portal_session';
    const SESSION_PIN = '1234';

    // ---------- PASSWORD ANIMATION ----------
    let passwordValue = '';

    function updateDots(value) {
        const dots = document.querySelectorAll('.password-dot');
        const len = value.length;
        
        dots.forEach((dot, index) => {
            dot.className = 'password-dot';
            
            if (index < len) {
                dot.classList.add('filled');
                if (dot.dataset.wasEmpty === 'true') {
                    dot.classList.add('active');
                    setTimeout(() => dot.classList.remove('active'), 500);
                }
                dot.dataset.wasEmpty = 'false';
            } else {
                dot.classList.add('empty');
                dot.dataset.wasEmpty = 'true';
            }
        });

        const cursor = document.getElementById('cursorIndicator');
        if (len < 8) {
            cursor.classList.add('visible');
        } else {
            cursor.classList.remove('visible');
        }
    }

    function handlePasswordInput() {
        const input = document.getElementById('pw');
        const value = input.value;
        passwordValue = value;
        updateDots(value);
    }

    function handlePasswordKey(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            handleEntry();
        }
        if (e.key === 'Backspace') {
            setTimeout(() => {
                const input = document.getElementById('pw');
                updateDots(input.value);
            }, 10);
        }
    }

    function showCursor() {
        const cursor = document.getElementById('cursorIndicator');
        if (passwordValue.length < 8) {
            cursor.classList.add('visible');
        }
    }

    function hideCursor() {
        const cursor = document.getElementById('cursorIndicator');
        cursor.classList.remove('visible');
    }

    function shakeDots() {
        const dots = document.querySelectorAll('.password-dot');
        dots.forEach(dot => {
            if (dot.classList.contains('filled')) {
                dot.classList.add('error-shake');
                setTimeout(() => dot.classList.remove('error-shake'), 500);
            }
        });
    }

    function resetPasswordInput() {
        const input = document.getElementById('pw');
        input.value = '';
        passwordValue = '';
        updateDots('');
        const dots = document.querySelectorAll('.password-dot');
        dots.forEach(dot => {
            dot.className = 'password-dot empty';
            dot.dataset.wasEmpty = 'true';
        });
    }

    // ---------- REMEMBER ME ----------
    function saveSession() {
        const remember = document.getElementById('rememberMe');
        if (remember && remember.checked) {
            localStorage.setItem(STORAGE_KEY, 'authenticated');
            localStorage.setItem(STORAGE_KEY + '_timestamp', Date.now().toString());
        } else {
            localStorage.removeItem(STORAGE_KEY);
            localStorage.removeItem(STORAGE_KEY + '_timestamp');
        }
    }

    function checkSession() {
        const session = localStorage.getItem(STORAGE_KEY);
        if (!session) return false;
        const timestamp = localStorage.getItem(STORAGE_KEY + '_timestamp');
        if (timestamp) {
            const days = (Date.now() - parseInt(timestamp)) / (1000 * 60 * 60 * 24);
            if (days > 7) {
                clearSession();
                return false;
            }
        }
        return session === 'authenticated';
    }

    function clearSession() {
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(STORAGE_KEY + '_timestamp');
    }

    function logout() {
        clearSession();
        const loginView = document.getElementById('login-view');
        const rosterView = document.getElementById('roster-view');
        
        if (!rosterView.classList.contains('hidden-view')) {
            rosterView.classList.add('exit');
            setTimeout(() => {
                rosterView.classList.add('hidden-view');
                rosterView.classList.remove('exit');
            }, 400);
        }
        
        setTimeout(() => {
            loginView.classList.remove('hidden-view');
            loginView.classList.add('enter');
            setTimeout(() => loginView.classList.remove('enter'), 500);
            resetPasswordInput();
            const entryBtn = document.getElementById('entry-btn');
            if (dataLoaded) {
                entryBtn.disabled = false;
                entryBtn.innerText = 'SIGN IN';
                entryBtn.className = 'embossed-btn fetched-active w-full py-7 tracking-widest uppercase';
            } else {
                entryBtn.disabled = true;
                entryBtn.innerText = 'جاري التحميل...';
                entryBtn.className = 'embossed-btn w-full py-7 tracking-widest uppercase';
            }
        }, 300);
    }

    // ---------- ENTRY HANDLER ----------
    window.handleEntry = function() {
        if (!dataLoaded) {
            showLoginError('البيانات لم تكتمل، حاول مرة أخرى');
            return;
        }
        const input = document.getElementById('pw');
        const pin = input.value;
        
        if (pin === SESSION_PIN) {
            saveSession();
            proceedAfterAuth();
        } else {
            shakeDots();
            showLoginError('الرمز غير صحيح');
            const btn = document.getElementById('entry-btn');
            btn.className = 'embossed-btn crimson-warning w-full py-7 tracking-widest uppercase';
            btn.innerText = "INCORRECT!";
            setTimeout(() => {
                if (dataLoaded) {
                    btn.className = 'embossed-btn fetched-active w-full py-7 tracking-widest uppercase';
                    btn.innerText = 'SIGN IN';
                } else {
                    btn.className = 'embossed-btn w-full py-7 tracking-widest uppercase';
                    btn.innerText = 'جاري التحميل...';
                }
            }, 1000);
            setTimeout(() => {
                resetPasswordInput();
                input.focus();
            }, 400);
        }
    };

    function proceedAfterAuth() {
        const loginView = document.getElementById('login-view');
        const rosterView = document.getElementById('roster-view');
        
        loginView.classList.add('exit');
        setTimeout(() => {
            loginView.classList.add('hidden-view');
            loginView.classList.remove('exit');
            renderRoster();
            rosterView.classList.remove('hidden-view');
            rosterView.classList.add('enter');
            setTimeout(() => rosterView.classList.remove('enter'), 500);
        }, 500);
    }

    function showLoginError(msg) {
        const errEl = document.getElementById('login-error');
        errEl.innerText = msg;
        errEl.classList.remove('hidden');
        setTimeout(() => errEl.classList.add('hidden'), 4000);
    }

    // ---------- LOADING & INIT ----------
    window.onload = async function() {
        const hasSession = checkSession();
        const loginView = document.getElementById('login-view');
        
        if (hasSession) {
            loginView.classList.add('hidden-view');
        }

        const shieldTimeout = setTimeout(() => {
            const s = document.getElementById('shield');
            if (s && s.style.opacity !== '0') {
                s.style.opacity = '0';
                setTimeout(() => s.remove(), 500);
            }
        }, 5000);

        try {
            await fetchDataWithTimeout(8000);
        } catch (e) {
            console.warn('Data fetch failed:', e);
            loadError = true;
            const cached = localStorage.getItem('duty_db_cache');
            if (cached) {
                try {
                    db = JSON.parse(cached);
                    dataLoaded = true;
                } catch (e2) { /* ignore */ }
            }
        }

        clearTimeout(shieldTimeout);
        const s = document.getElementById('shield');
        if (s) { s.style.opacity = '0'; setTimeout(() => s.remove(), 500); }

        const entryBtn = document.getElementById('entry-btn');
        const statusText = document.getElementById('status-text');

        if (dataLoaded) {
            statusText.innerText = 'READY';
            statusText.className = 'status-text ready';
            entryBtn.disabled = false;
            entryBtn.innerText = 'SIGN IN';
            entryBtn.className = 'embossed-btn fetched-active w-full py-7 tracking-widest uppercase';
            
            if (hasSession) {
                setTimeout(() => {
                    renderRoster();
                    document.getElementById('roster-view').classList.remove('hidden-view');
                    document.getElementById('roster-view').classList.add('enter');
                    setTimeout(() => document.getElementById('roster-view').classList.remove('enter'), 500);
                }, 200);
            } else {
                if (!loginView.classList.contains('hidden-view')) {
                    setTimeout(() => {
                        document.getElementById('pw').focus();
                    }, 300);
                } else {
                    loginView.classList.remove('hidden-view');
                    loginView.classList.add('enter');
                    setTimeout(() => {
                        loginView.classList.remove('enter');
                        document.getElementById('pw').focus();
                    }, 300);
                }
            }
        } else if (loadError) {
            statusText.innerText = '⚠️ غير متصل';
            statusText.className = 'status-text error';
            entryBtn.disabled = true;
            entryBtn.innerText = '⚠️ خطأ في الاتصال';
            entryBtn.className = 'embossed-btn w-full py-7 tracking-widest uppercase';
            showLoginError('تعذر الاتصال بقاعدة البيانات. يرجى تحديث الصفحة.');
            
            if (loginView.classList.contains('hidden-view')) {
                loginView.classList.remove('hidden-view');
                loginView.classList.add('enter');
                setTimeout(() => loginView.classList.remove('enter'), 300);
            }
        }

        const rememberCheck = document.getElementById('rememberMe');
        if (rememberCheck) {
            rememberCheck.checked = true;
        }

        resetPasswordInput();
    };

    async function fetchDataWithTimeout(timeoutMs) {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), timeoutMs);

        try {
            const res = await fetch(`https://api.github.com/repos/${CONFIG.user}/${CONFIG.repo}/contents/${CONFIG.path}?t=${Date.now()}`, {
                headers: { "Authorization": `token ${GH_TOKEN}` },
                signal: controller.signal
            });
            clearTimeout(timeoutId);

            if (res.ok) {
                const data = await res.json();
                const decoded = JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\s/g, '')))));
                db = decoded;
                localStorage.setItem('duty_db_cache', JSON.stringify(db));
                dataLoaded = true;
                loadError = false;
                return true;
            } else {
                throw new Error(`HTTP ${res.status}`);
            }
        } catch (e) {
            clearTimeout(timeoutId);
            throw e;
        }
    }

    function getMedicalDate() {
        const now = new Date();
        if (now.getHours() < 8) now.setDate(now.getDate() - 1);
        const d = String(now.getDate()).padStart(2, '0');
        const m = String(now.getMonth() + 1).padStart(2, '0');
        return `${d}/${m}/${now.getFullYear()}`;
    }

    // ---------- ROSTER RENDERER ----------
    function renderRoster() {
        const container = document.getElementById('roster-container');
        const dateDisplay = document.getElementById('roster-date');
        const countDisplay = document.getElementById('roster-count');
        
        const targetDate = getMedicalDate();
        const now = new Date();
        const formattedDate = `${String(now.getDate()).padStart(2, '0')}-${now.toLocaleString('en-GB', {month:'short'})}-${now.getFullYear()}`;
        dateDisplay.innerText = `📅 ${formattedDate}`;

        const todayEntries = db.schedule.filter(s => s.date === targetDate);

        if (todayEntries.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="icon">📭</div>
                    <div>لا يوجد مقيمين في الخدمة اليوم</div>
                </div>
            `;
            countDisplay.innerText = '0 مقيم';
            return;
        }

        countDisplay.innerText = `${todayEntries.length} مقيم في الخدمة`;

        const sortedEntries = [...todayEntries].sort((a, b) => a.specCode.localeCompare(b.specCode));

        container.innerHTML = sortedEntries.map(entry => {
            const resident = db.names.find(n => n.name === entry.name);
            const phone = resident?.phone || "رقم غير متوفر";
            const specName = arabicSpecs[entry.specCode] || entry.specCode;
            const isPhoneValid = phone && phone !== "رقم غير متوفر" && phone.length > 5;
            
            return `
                <div class="roster-card">
                    <div class="card-header">
                        <span class="resident-spec">${specName}</span>
                    </div>
                    <div class="resident-name">${entry.name}</div>
                    <div class="resident-phone">${phone}</div>
                    <div class="card-actions">
                        <a href="${isPhoneValid ? 'tel:' + phone : '#'}" 
                           class="action-btn-sm call ${!isPhoneValid ? 'opacity-40 pointer-events-none' : ''}"
                           style="${!isPhoneValid ? 'cursor:default;' : ''}">
                            <span>📞</span> <span>Call</span>
                        </a>
                        <a href="${isPhoneValid ? 'whatsapp://send?phone=' + phone : '#'}" 
                           class="action-btn-sm wa ${!isPhoneValid ? 'opacity-40 pointer-events-none' : ''}"
                           style="${!isPhoneValid ? 'cursor:default;' : ''}"
                           onclick="${isPhoneValid ? 'event.preventDefault(); window.location.href=this.href;' : 'event.preventDefault();'}">
                            <span>💬</span> <span>WhatsApp</span>
                        </a>
                    </div>
                </div>
            `;
        }).join('');
    }

    window.logout = logout;

    document.addEventListener('DOMContentLoaded', function() {
        const container = document.getElementById('passwordContainer');
        container.addEventListener('click', function() {
            document.getElementById('pw').focus();
        });
    });
</script>
</body>
</html>
