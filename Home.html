<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Duty Roster 🇮🇶</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --bg: #1a1c20;
            --light: #2a2d34;
            --shadow: #0d0e11;
            --accent: #fbbf24;
            --crimson: #e11d48;
            --emerald: #10b981;
            --btn-grey: #33373e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: #94a3b8;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 1.5rem;
        }

        /* Full page layout */
        .page-container {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* Header with day/night toggle */
        .roster-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding: 0 0.25rem;
        }
        .roster-header h1 {
            font-size: 1.5rem;
            font-weight: 800;
            color: #f0ece4;
            letter-spacing: 0.02em;
        }
        .roster-header .header-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        /* Theme Toggle */
        .theme-toggle-wrap {
            perspective: 200px;
            display: inline-block;
        }
        .theme-toggle-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid rgba(148, 163, 184, 0.15);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            transform-style: preserve-3d;
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(148, 163, 184, 0.1);
        }
        .theme-toggle-btn .icon-wrap {
            position: relative;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .theme-toggle-btn .icon-wrap i {
            position: absolute;
            font-size: 1rem;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            backface-visibility: hidden;
        }
        .theme-toggle-btn .icon-wrap .icon-moon {
            transform: rotateY(0deg);
            opacity: 1;
            color: #94a3b8;
        }
        .theme-toggle-btn .icon-wrap .icon-sun {
            transform: rotateY(180deg);
            opacity: 0;
            color: #fbbf24;
        }
        body.light .theme-toggle-btn .icon-wrap .icon-moon {
            transform: rotateY(-180deg);
            opacity: 0;
        }
        body.light .theme-toggle-btn .icon-wrap .icon-sun {
            transform: rotateY(0deg);
            opacity: 1;
        }
        .theme-toggle-btn:hover {
            transform: scale(1.05);
            border-color: rgba(251, 191, 36, 0.2);
        }

        /* Logout button */
        .logout-btn {
            background: transparent;
            border: none;
            color: rgba(148, 163, 184, 0.3);
            font-size: 0.6rem;
            cursor: pointer;
            transition: color 0.3s ease;
            padding: 0.3rem 0.6rem;
            border-radius: 0.5rem;
            border: 1px solid rgba(148, 163, 184, 0.05);
        }
        .logout-btn:hover {
            color: rgba(148, 163, 184, 0.6);
            border-color: rgba(148, 163, 184, 0.1);
        }

        /* Roster grid - full width */
        .roster-grid {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            max-height: 65vh;
            overflow-y: auto;
            padding-right: 0.25rem;
            padding-bottom: 1rem;
        }
        .roster-grid::-webkit-scrollbar {
            width: 4px;
        }
        .roster-grid::-webkit-scrollbar-track {
            background: transparent;
        }
        .roster-grid::-webkit-scrollbar-thumb {
            background: rgba(251, 191, 36, 0.2);
            border-radius: 4px;
        }

        /* ============================================================
           SPECIALTY THEMED CARDS
           ============================================================ */
        .roster-card {
            border-radius: 1.5rem;
            padding: 1.1rem 1.3rem;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            transform: translateY(0);
            border: 1px solid rgba(255,255,255,0.03);
            position: relative;
            overflow: hidden;
        }
        .roster-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            opacity: 0.6;
        }
        .roster-card:hover {
            transform: translateY(-2px) scale(1.01);
        }
        .roster-card:active {
            transform: scale(0.98);
        }

        .roster-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.4rem;
        }
        .roster-card .resident-name {
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 0.02em;
        }
        .roster-card .resident-spec {
            font-size: 0.55rem;
            font-weight: 700;
            padding: 0.15rem 0.6rem;
            border-radius: 100px;
            border: 1px solid rgba(255,255,255,0.08);
            white-space: nowrap;
        }
        .roster-card .resident-phone {
            font-size: 0.8rem;
            font-weight: 600;
            font-family: monospace;
            direction: ltr;
            unicode-bidi: isolate;
            opacity: 0.8;
        }
        .roster-card .card-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.2rem;
        }
        .roster-card .action-btn-sm {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 0.5rem 0.6rem;
            border-radius: 1rem;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.55rem;
            letter-spacing: 0.02em;
            white-space: nowrap;
            transition: all 0.2s ease;
            transform: translateY(0);
            border: none;
            cursor: pointer;
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(4px);
        }
        .roster-card .action-btn-sm:active {
            transform: scale(0.96);
        }
        .roster-card .action-btn-sm.call {
            color: #60a5fa;
            border: 1px solid rgba(96, 165, 250, 0.15);
        }
        .roster-card .action-btn-sm.call:hover {
            background: rgba(96, 165, 250, 0.12);
        }
        .roster-card .action-btn-sm.wa {
            color: var(--emerald);
            border: 1px solid rgba(16, 185, 129, 0.15);
        }
        .roster-card .action-btn-sm.wa:hover {
            background: rgba(16, 185, 129, 0.12);
        }
        .roster-card .action-btn-sm .icon {
            font-size: 0.9rem;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: rgba(148, 163, 184, 0.2);
            font-size: 0.9rem;
            font-weight: 600;
        }
        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.3;
        }

        /* ============================================================
           SPECIALTY COLORS (Dark Theme)
           ============================================================ */
        /* GS - General Surgery */
        .card-gs { background: linear-gradient(145deg, #1a2a1a, #0f1a0f); border-color: rgba(74, 222, 128, 0.1); }
        .card-gs .resident-name { color: #86efac; }
        .card-gs .resident-spec { background: rgba(74, 222, 128, 0.12); color: #86efac; border-color: rgba(74, 222, 128, 0.1); }
        .card-gs::before { background: linear-gradient(90deg, #4ade80, #22c55e); }

        /* US - Urosurgery */
        .card-us { background: linear-gradient(145deg, #1a1a2a, #0f0f1a); border-color: rgba(96, 165, 250, 0.1); }
        .card-us .resident-name { color: #93c5fd; }
        .card-us .resident-spec { background: rgba(96, 165, 250, 0.12); color: #93c5fd; border-color: rgba(96, 165, 250, 0.1); }
        .card-us::before { background: linear-gradient(90deg, #60a5fa, #3b82f6); }

        /* OR - Orthopaedics */
        .card-or { background: linear-gradient(145deg, #2a1a1a, #1a0f0f); border-color: rgba(251, 146, 60, 0.1); }
        .card-or .resident-name { color: #fdba74; }
        .card-or .resident-spec { background: rgba(251, 146, 60, 0.12); color: #fdba74; border-color: rgba(251, 146, 60, 0.1); }
        .card-or::before { background: linear-gradient(90deg, #fb923c, #f97316); }

        /* ENT */
        .card-ent { background: linear-gradient(145deg, #1a1a2a, #0f0f1a); border-color: rgba(196, 181, 253, 0.1); }
        .card-ent .resident-name { color: #c4b5fd; }
        .card-ent .resident-spec { background: rgba(196, 181, 253, 0.12); color: #c4b5fd; border-color: rgba(196, 181, 253, 0.1); }
        .card-ent::before { background: linear-gradient(90deg, #a78bfa, #8b5cf6); }

        /* M - Internal Medicine */
        .card-m { background: linear-gradient(145deg, #1a2a1a, #0f1a0f); border-color: rgba(52, 211, 153, 0.1); }
        .card-m .resident-name { color: #6ee7b7; }
        .card-m .resident-spec { background: rgba(52, 211, 153, 0.12); color: #6ee7b7; border-color: rgba(52, 211, 153, 0.1); }
        .card-m::before { background: linear-gradient(90deg, #34d399, #10b981); }

        /* Pe - Paediatrics */
        .card-pe { background: linear-gradient(145deg, #2a1a2a, #1a0f1a); border-color: rgba(244, 114, 182, 0.1); }
        .card-pe .resident-name { color: #f9a8d4; }
        .card-pe .resident-spec { background: rgba(244, 114, 182, 0.12); color: #f9a8d4; border-color: rgba(244, 114, 182, 0.1); }
        .card-pe::before { background: linear-gradient(90deg, #f472b6, #ec4899); }

        /* NM - Neuromedicine */
        .card-nm { background: linear-gradient(145deg, #1a1a2a, #0f0f1a); border-color: rgba(129, 140, 248, 0.1); }
        .card-nm .resident-name { color: #a5b4fc; }
        .card-nm .resident-spec { background: rgba(129, 140, 248, 0.12); color: #a5b4fc; border-color: rgba(129, 140, 248, 0.1); }
        .card-nm::before { background: linear-gradient(90deg, #818cf8, #6366f1); }

        /* N - Nephrology */
        .card-n { background: linear-gradient(145deg, #1a2a2a, #0f1a1a); border-color: rgba(56, 189, 248, 0.1); }
        .card-n .resident-name { color: #7dd3fc; }
        .card-n .resident-spec { background: rgba(56, 189, 248, 0.12); color: #7dd3fc; border-color: rgba(56, 189, 248, 0.1); }
        .card-n::before { background: linear-gradient(90deg, #38bdf8, #0ea5e9); }

        /* O - Ophthalmology */
        .card-o { background: linear-gradient(145deg, #1a2a1a, #0f1a0f); border-color: rgba(74, 222, 128, 0.08); }
        .card-o .resident-name { color: #86efac; }
        .card-o .resident-spec { background: rgba(74, 222, 128, 0.1); color: #86efac; border-color: rgba(74, 222, 128, 0.08); }
        .card-o::before { background: linear-gradient(90deg, #4ade80, #22c55e); }

        /* ICU */
        .card-icu { background: linear-gradient(145deg, #1a1a1a, #0f0f0f); border-color: rgba(248, 113, 113, 0.1); }
        .card-icu .resident-name { color: #fca5a5; }
        .card-icu .resident-spec { background: rgba(248, 113, 113, 0.12); color: #fca5a5; border-color: rgba(248, 113, 113, 0.1); }
        .card-icu::before { background: linear-gradient(90deg, #f87171, #ef4444); }

        /* OP - Anesthesia OP */
        .card-op { background: linear-gradient(145deg, #1a1a2a, #0f0f1a); border-color: rgba(167, 139, 250, 0.1); }
        .card-op .resident-name { color: #c4b5fd; }
        .card-op .resident-spec { background: rgba(167, 139, 250, 0.12); color: #c4b5fd; border-color: rgba(167, 139, 250, 0.1); }
        .card-op::before { background: linear-gradient(90deg, #a78bfa, #8b5cf6); }

        /* MF - MaxilloFacial */
        .card-mf { background: linear-gradient(145deg, #2a1a1a, #1a0f0f); border-color: rgba(251, 191, 36, 0.1); }
        .card-mf .resident-name { color: #fcd34d; }
        .card-mf .resident-spec { background: rgba(251, 191, 36, 0.12); color: #fcd34d; border-color: rgba(251, 191, 36, 0.1); }
        .card-mf::before { background: linear-gradient(90deg, #fbbf24, #f59e0b); }

        /* R - Radiology */
        .card-r { background: linear-gradient(145deg, #1a1a2a, #0f0f1a); border-color: rgba(103, 232, 249, 0.1); }
        .card-r .resident-name { color: #67e8f9; }
        .card-r .resident-spec { background: rgba(103, 232, 249, 0.12); color: #67e8f9; border-color: rgba(103, 232, 249, 0.1); }
        .card-r::before { background: linear-gradient(90deg, #67e8f9, #22d3ee); }

        /* G - Gynecology */
        .card-g { background: linear-gradient(145deg, #2a1a2a, #1a0f1a); border-color: rgba(244, 114, 182, 0.1); }
        .card-g .resident-name { color: #f9a8d4; }
        .card-g .resident-spec { background: rgba(244, 114, 182, 0.12); color: #f9a8d4; border-color: rgba(244, 114, 182, 0.1); }
        .card-g::before { background: linear-gradient(90deg, #f472b6, #ec4899); }

        /* P - Psychiatry */
        .card-p { background: linear-gradient(145deg, #1a1a2a, #0f0f1a); border-color: rgba(196, 181, 253, 0.08); }
        .card-p .resident-name { color: #c4b5fd; }
        .card-p .resident-spec { background: rgba(196, 181, 253, 0.1); color: #c4b5fd; border-color: rgba(196, 181, 253, 0.08); }
        .card-p::before { background: linear-gradient(90deg, #a78bfa, #8b5cf6); }

        /* D - Death */
        .card-d { background: linear-gradient(145deg, #1a1a1a, #0f0f0f); border-color: rgba(148, 163, 184, 0.05); }
        .card-d .resident-name { color: #94a3b8; }
        .card-d .resident-spec { background: rgba(148, 163, 184, 0.08); color: #94a3b8; border-color: rgba(148, 163, 184, 0.05); }
        .card-d::before { background: linear-gradient(90deg, #94a3b8, #64748b); }

        /* Default fallback */
        .card-default { background: #2a2d34; border-color: rgba(148, 163, 184, 0.05); }
        .card-default .resident-name { color: #f0ece4; }
        .card-default .resident-spec { background: rgba(148, 163, 184, 0.08); color: #94a3b8; border-color: rgba(148, 163, 184, 0.05); }
        .card-default::before { background: linear-gradient(90deg, #94a3b8, #64748b); }

        /* ============================================================
           LIGHT THEME OVERRIDES
           ============================================================ */
        body.light {
            background: #e8edf2;
        }
        body.light .roster-header h1 {
            color: #1a2332;
        }
        body.light .theme-toggle-btn {
            background: rgba(255,255,255,0.5);
            border-color: rgba(0,0,0,0.08);
        }
        body.light .logout-btn {
            color: rgba(74, 85, 104, 0.3);
            border-color: rgba(0,0,0,0.05);
        }
        body.light .logout-btn:hover {
            color: rgba(74, 85, 104, 0.6);
        }

        /* Light theme card overrides */
        body.light .card-gs { background: linear-gradient(145deg, #e8f5e8, #d4edda); border-color: rgba(34, 197, 94, 0.15); }
        body.light .card-gs .resident-name { color: #166534; }
        body.light .card-gs .resident-spec { background: rgba(34, 197, 94, 0.12); color: #166534; }

        body.light .card-us { background: linear-gradient(145deg, #e8f0f8, #d4e4f0); border-color: rgba(37, 99, 235, 0.15); }
        body.light .card-us .resident-name { color: #1e40af; }
        body.light .card-us .resident-spec { background: rgba(37, 99, 235, 0.12); color: #1e40af; }

        body.light .card-or { background: linear-gradient(145deg, #f8ede8, #f0ddd4); border-color: rgba(234, 88, 12, 0.15); }
        body.light .card-or .resident-name { color: #7c2d12; }
        body.light .card-or .resident-spec { background: rgba(234, 88, 12, 0.12); color: #7c2d12; }

        body.light .card-ent { background: linear-gradient(145deg, #ede8f8, #ddd4f0); border-color: rgba(109, 40, 217, 0.15); }
        body.light .card-ent .resident-name { color: #4c1d95; }
        body.light .card-ent .resident-spec { background: rgba(109, 40, 217, 0.12); color: #4c1d95; }

        body.light .card-m { background: linear-gradient(145deg, #e8f5ed, #d4ede0); border-color: rgba(5, 150, 105, 0.15); }
        body.light .card-m .resident-name { color: #064e3b; }
        body.light .card-m .resident-spec { background: rgba(5, 150, 105, 0.12); color: #064e3b; }

        body.light .card-pe { background: linear-gradient(145deg, #f8edf0, #f0dde4); border-color: rgba(190, 24, 93, 0.15); }
        body.light .card-pe .resident-name { color: #831843; }
        body.light .card-pe .resident-spec { background: rgba(190, 24, 93, 0.12); color: #831843; }

        body.light .card-nm { background: linear-gradient(145deg, #edf0f8, #dde4f0); border-color: rgba(67, 56, 202, 0.15); }
        body.light .card-nm .resident-name { color: #312e81; }
        body.light .card-nm .resident-spec { background: rgba(67, 56, 202, 0.12); color: #312e81; }

        body.light .card-n { background: linear-gradient(145deg, #e8f4f8, #d4e8f0); border-color: rgba(2, 132, 199, 0.15); }
        body.light .card-n .resident-name { color: #0c4a6e; }
        body.light .card-n .resident-spec { background: rgba(2, 132, 199, 0.12); color: #0c4a6e; }

        body.light .card-o { background: linear-gradient(145deg, #e8f5ec, #d4ede0); border-color: rgba(5, 150, 105, 0.12); }
        body.light .card-o .resident-name { color: #064e3b; }
        body.light .card-o .resident-spec { background: rgba(5, 150, 105, 0.1); color: #064e3b; }

        body.light .card-icu { background: linear-gradient(145deg, #f8ecec, #f0dcdc); border-color: rgba(185, 28, 28, 0.15); }
        body.light .card-icu .resident-name { color: #7f1d1d; }
        body.light .card-icu .resident-spec { background: rgba(185, 28, 28, 0.12); color: #7f1d1d; }

        body.light .card-op { background: linear-gradient(145deg, #ede8f8, #ddd4f0); border-color: rgba(109, 40, 217, 0.12); }
        body.light .card-op .resident-name { color: #4c1d95; }
        body.light .card-op .resident-spec { background: rgba(109, 40, 217, 0.1); color: #4c1d95; }

        body.light .card-mf { background: linear-gradient(145deg, #f8f0e8, #f0e4d4); border-color: rgba(180, 83, 9, 0.15); }
        body.light .card-mf .resident-name { color: #78350f; }
        body.light .card-mf .resident-spec { background: rgba(180, 83, 9, 0.12); color: #78350f; }

        body.light .card-r { background: linear-gradient(145deg, #e8f4f8, #d4e8f0); border-color: rgba(6, 182, 212, 0.15); }
        body.light .card-r .resident-name { color: #164e63; }
        body.light .card-r .resident-spec { background: rgba(6, 182, 212, 0.12); color: #164e63; }

        body.light .card-g { background: linear-gradient(145deg, #f8edf0, #f0dde4); border-color: rgba(190, 24, 93, 0.12); }
        body.light .card-g .resident-name { color: #831843; }
        body.light .card-g .resident-spec { background: rgba(190, 24, 93, 0.1); color: #831843; }

        body.light .card-p { background: linear-gradient(145deg, #edf0f8, #dde4f0); border-color: rgba(67, 56, 202, 0.12); }
        body.light .card-p .resident-name { color: #312e81; }
        body.light .card-p .resident-spec { background: rgba(67, 56, 202, 0.1); color: #312e81; }

        body.light .card-d { background: linear-gradient(145deg, #ececec, #dcdcdc); border-color: rgba(100, 116, 139, 0.12); }
        body.light .card-d .resident-name { color: #334155; }
        body.light .card-d .resident-spec { background: rgba(100, 116, 139, 0.1); color: #334155; }

        body.light .card-default { background: #e8edf2; border-color: rgba(0,0,0,0.05); }
        body.light .card-default .resident-name { color: #1a2332; }
        body.light .card-default .resident-spec { background: rgba(0,0,0,0.05); color: #475569; }

        body.light .empty-state { color: rgba(74, 85, 104, 0.2); }

        /* ============================================================
           SHIELD / LOADING
           ============================================================ */
        #shield {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 100;
            transition: opacity 0.5s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
        }
        #shield .shield-spinner {
            width: 3rem;
            height: 3rem;
            border: 3px solid rgba(251, 191, 36, 0.06);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #shield .shield-text {
            color: rgba(251, 191, 36, 0.3);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }
        body.light #shield {
            background: #e8edf2;
        }
        body.light #shield .shield-text {
            color: rgba(59, 130, 246, 0.3);
        }
        body.light #shield .shield-spinner {
            border-color: rgba(59, 130, 246, 0.06);

<script>
    // ############################################################
    // COMPLETE ROSTER FUNCTIONALITY
    // ############################################################

    const CONFIG = { user: "mHub96", repo: "BTH", path: "data.json" };
    const _pt1 = "ghp_dAUtsFhTH";
    const _pt2 = "a2KeJQOsxsC";
    const _pt3 = "Ct1vz8z1Z63";
    const _pt4 = "Am sjS";
    const GH_TOKEN = (_pt1 + _pt2 + _pt3 + _pt4).replace(/\s/g, '');

    const arabicSpecs = {
        "MF": "جراحة الوجه و الفكين", "M": "الباطنية", "P": "النفسية", "G": "النسائية و التوليد",
        "GS": "الجراحة العامة", "US": "جراحة المسالك البولية",
        "ENT": "الأذن و الأنف و الحنجرة", "OR": "الكسور", "Pe": "الاطفال", "NM": "طب الجملة العصبية", "N": "طب امراض الكلى",
        "ICU": "تخدير العناية المركزة", "OP": "تخدير العمليات",
        "R": "الأشعة و السونار","O": "العيون", "D": "الوفيات"
    };

    // Icons for each specialty
    const specIcons = {
        "GS": "🔪",
        "US": "🧬",
        "OR": "🦴",
        "ENT": "👂",
        "M": "💊",
        "Pe": "👶",
        "NM": "🧠",
        "N": "🧫",
        "O": "👁️",
        "ICU": "💉",
        "OP": "💉",
        "MF": "🦷",
        "R": "🩻",
        "G": "🌸",
        "P": "🧠",
        "D": "📋"
    };

    let db = { names: [], schedule: [] };
    let fileSha = "";
    let dataLoaded = false;
    let loadError = false;
    let isSessionRestored = false;

    const STORAGE_KEY = 'duty_roster_session';
    const SESSION_PIN = '1234';

    // ---------- PASSWORD ANIMATION ----------
    let passwordValue = '';

    function updateDots(value) {
        const dots = document.querySelectorAll('.password-dot');
        const len = value.length;
        
        dots.forEach((dot, index) => {
            dot.className = 'password-dot';
            
            if (index < len) {
                dot.classList.add('filled');
                if (dot.dataset.wasEmpty === 'true') {
                    dot.classList.add('active');
                    setTimeout(() => dot.classList.remove('active'), 500);
                }
                dot.dataset.wasEmpty = 'false';
            } else {
                dot.classList.add('empty');
                dot.dataset.wasEmpty = 'true';
            }
        });

        const cursor = document.querySelector('.cursor-indicator');
        if (cursor) {
            if (len < 8) {
                cursor.classList.add('visible');
            } else {
                cursor.classList.remove('visible');
            }
        }
    }

    function handlePasswordInput() {
        const input = document.getElementById('pw');
        const value = input.value;
        passwordValue = value;
        updateDots(value);
    }

    function handlePasswordKey(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            handleEntry();
        }
        if (e.key === 'Backspace') {
            setTimeout(() => {
                const input = document.getElementById('pw');
                updateDots(input.value);
            }, 10);
        }
    }

    function showCursor() {
        const cursor = document.querySelector('.cursor-indicator');
        if (cursor && passwordValue.length < 8) {
            cursor.classList.add('visible');
        }
    }

    function hideCursor() {
        const cursor = document.querySelector('.cursor-indicator');
        if (cursor) cursor.classList.remove('visible');
    }

    function shakeDots() {
        const dots = document.querySelectorAll('.password-dot');
        dots.forEach(dot => {
            if (dot.classList.contains('filled')) {
                dot.classList.add('error-shake');
                setTimeout(() => dot.classList.remove('error-shake'), 500);
            }
        });
    }

    function resetPasswordInput() {
        const input = document.getElementById('pw');
        input.value = '';
        passwordValue = '';
        updateDots('');
        const dots = document.querySelectorAll('.password-dot');
        dots.forEach(dot => {
            dot.className = 'password-dot empty';
            dot.dataset.wasEmpty = 'true';
        });
    }

    // ---------- THEME ----------
    function toggleTheme() {
        document.getElementById('app-body').classList.toggle('light');
        const isLight = document.getElementById('app-body').classList.contains('light');
        localStorage.setItem('roster_theme', isLight ? 'light' : 'dark');
    }

    // Load theme from localStorage
    if (localStorage.getItem('roster_theme') === 'light') {
        document.getElementById('app-body').classList.add('light');
    }

    // ---------- REMEMBER ME ----------
    function saveSession() {
        const remember = document.getElementById('rememberMe');
        if (remember && remember.checked) {
            localStorage.setItem(STORAGE_KEY, 'authenticated');
            localStorage.setItem(STORAGE_KEY + '_timestamp', Date.now().toString());
        } else {
            localStorage.removeItem(STORAGE_KEY);
            localStorage.removeItem(STORAGE_KEY + '_timestamp');
        }
    }

    function checkSession() {
        const session = localStorage.getItem(STORAGE_KEY);
        if (!session) return false;
        const timestamp = localStorage.getItem(STORAGE_KEY + '_timestamp');
        if (timestamp) {
            const days = (Date.now() - parseInt(timestamp)) / (1000 * 60 * 60 * 24);
            if (days > 7) {
                clearSession();
                return false;
            }
        }
        return session === 'authenticated';
    }

    function clearSession() {
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(STORAGE_KEY + '_timestamp');
    }

    function logout() {
        clearSession();
        isSessionRestored = false;
        const loginView = document.getElementById('login-view');
        const rosterView = document.getElementById('roster-view');
        
        if (!rosterView.classList.contains('hidden-view')) {
            rosterView.classList.add('exit');
            setTimeout(() => {
                rosterView.classList.add('hidden-view');
                rosterView.classList.remove('exit');
            }, 400);
        }
        
        setTimeout(() => {
            loginView.classList.remove('hidden-view');
            loginView.classList.add('enter');
            setTimeout(() => loginView.classList.remove('enter'), 500);
            resetPasswordInput();
            const entryBtn = document.getElementById('entry-btn');
            if (dataLoaded) {
                entryBtn.disabled = false;
                entryBtn.innerText = 'SIGN IN';
                entryBtn.className = 'embossed-btn fetched-active w-full py-5 tracking-widest uppercase';
            } else {
                entryBtn.disabled = true;
                entryBtn.innerText = 'جاري التحميل...';
                entryBtn.className = 'embossed-btn w-full py-5 tracking-widest uppercase';
            }
        }, 300);
    }

    // ---------- ENTRY HANDLER ----------
    window.handleEntry = function() {
        if (!dataLoaded) {
            showLoginError('البيانات لم تكتمل، حاول مرة أخرى');
            return;
        }
        const input = document.getElementById('pw');
        const pin = input.value;
        
        if (pin === SESSION_PIN) {
            saveSession();
            proceedAfterAuth();
        } else {
            shakeDots();
            showLoginError('الرمز غير صحيح');
            const btn = document.getElementById('entry-btn');
            btn.className = 'embossed-btn crimson-warning w-full py-5 tracking-widest uppercase';
            const original = btn.innerText;
            btn.innerText = "INCORRECT!";
            setTimeout(() => {
                if (dataLoaded) {
                    btn.className = 'embossed-btn fetched-active w-full py-5 tracking-widest uppercase';
                    btn.innerText = 'SIGN IN';
                } else {
                    btn.className = 'embossed-btn w-full py-5 tracking-widest uppercase';
                    btn.innerText = 'جاري التحميل...';
                }
            }, 1000);
            setTimeout(() => {
                resetPasswordInput();
                input.focus();
            }, 400);
        }
    };

    function proceedAfterAuth() {
        const loginView = document.getElementById('login-view');
        const rosterView = document.getElementById('roster-view');
        
        loginView.classList.add('exit');
        setTimeout(() => {
            loginView.classList.add('hidden-view');
            loginView.classList.remove('exit');
            renderRoster();
            rosterView.classList.remove('hidden-view');
            rosterView.classList.add('enter');
            setTimeout(() => rosterView.classList.remove('enter'), 500);
        }, 500);
    }

    function showLoginError(msg) {
        const errEl = document.getElementById('login-error');
        errEl.innerText = msg;
        errEl.classList.remove('hidden');
        setTimeout(() => errEl.classList.add('hidden'), 4000);
    }

    // ---------- LOADING & INIT ----------
    window.onload = async function() {
        const hasSession = checkSession();
        const loginView = document.getElementById('login-view');
        
        if (hasSession) {
            loginView.classList.add('hidden-view');
            isSessionRestored = true;
        }

        const shieldTimeout = setTimeout(() => {
            const s = document.getElementById('shield');
            if (s && s.style.opacity !== '0') {
                s.style.opacity = '0';
                setTimeout(() => s.remove(), 500);
            }
        }, 5000);

        try {
            await fetchDataWithTimeout(8000);
        } catch (e) {
            console.warn('Data fetch failed:', e);
            loadError = true;
            const cached = localStorage.getItem('duty_db_cache');
            if (cached) {
                try {
                    db = JSON.parse(cached);
                    dataLoaded = true;
                } catch (e2) { /* ignore */ }
            }
        }

        clearTimeout(shieldTimeout);
        const s = document.getElementById('shield');
        if (s) { s.style.opacity = '0'; setTimeout(() => s.remove(), 500); }

        const entryBtn = document.getElementById('entry-btn');
        const statusText = document.getElementById('status-text');

        if (dataLoaded) {
            statusText.innerText = 'READY';
            statusText.className = 'status-text ready';
            entryBtn.disabled = false;
            entryBtn.innerText = 'SIGN IN';
            entryBtn.className = 'embossed-btn fetched-active w-full py-5 tracking-widest uppercase';
            
            if (hasSession) {
                setTimeout(() => {
                    renderRoster();
                    document.getElementById('roster-view').classList.remove('hidden-view');
                    document.getElementById('roster-view').classList.add('enter');
                    setTimeout(() => document.getElementById('roster-view').classList.remove('enter'), 500);
                }, 200);
            } else {
                if (!loginView.classList.contains('hidden-view')) {
                    setTimeout(() => {
                        document.getElementById('pw').focus();
                    }, 300);
                } else {
                    loginView.classList.remove('hidden-view');
                    loginView.classList.add('enter');
                    setTimeout(() => {
                        loginView.classList.remove('enter');
                        document.getElementById('pw').focus();
                    }, 300);
                }
            }
        } else if (loadError) {
            statusText.innerText = '⚠️ غير متصل';
            statusText.className = 'status-text error';
            entryBtn.disabled = true;
            entryBtn.innerText = '⚠️ خطأ في الاتصال';
            entryBtn.className = 'embossed-btn w-full py-5 tracking-widest uppercase';
            showLoginError('تعذر الاتصال بقاعدة البيانات. يرجى تحديث الصفحة.');
            
            if (loginView.classList.contains('hidden-view')) {
                loginView.classList.remove('hidden-view');
                loginView.classList.add('enter');
                setTimeout(() => loginView.classList.remove('enter'), 300);
            }
        }

        const rememberCheck = document.getElementById('rememberMe');
        if (rememberCheck) {
            rememberCheck.checked = true;
        }

        resetPasswordInput();
    };

    async function fetchDataWithTimeout(timeoutMs) {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), timeoutMs);

        try {
            const res = await fetch(`https://api.github.com/repos/${CONFIG.user}/${CONFIG.repo}/contents/${CONFIG.path}?t=${Date.now()}`, {
                headers: { "Authorization": `token ${GH_TOKEN}` },
                signal: controller.signal
            });
            clearTimeout(timeoutId);

            if (res.ok) {
                const data = await res.json();
                fileSha = data.sha;
                const decoded = JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\s/g, '')))));
                db = decoded;
                localStorage.setItem('duty_db_cache', JSON.stringify(db));
                dataLoaded = true;
                loadError = false;
                return true;
            } else {
                throw new Error(`HTTP ${res.status}`);
            }
        } catch (e) {
            clearTimeout(timeoutId);
            throw e;
        }
    }

    function getMedicalDate() {
        const now = new Date();
        if (now.getHours() < 8) now.setDate(now.getDate() - 1);
        const d = String(now.getDate()).padStart(2, '0');
        const m = String(now.getMonth() + 1).padStart(2, '0');
        return `${d}/${m}/${now.getFullYear()}`;
    }

    // ---------- ROSTER RENDERER ----------
    function renderRoster() {
        const container = document.getElementById('roster-container');
        const dateDisplay = document.getElementById('roster-date');
        const countDisplay = document.getElementById('roster-count');
        
        const targetDate = getMedicalDate();
        const now = new Date();
        const formattedDate = `${String(now.getDate()).padStart(2, '0')}-${now.toLocaleString('en-GB', {month:'short'})}-${now.getFullYear()}`;
        dateDisplay.innerText = `📅 ${formattedDate}`;

        const todayEntries = db.schedule.filter(s => s.date === targetDate);

        if (todayEntries.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="icon">📭</div>
                    <div>لا يوجد مقيمين في الخدمة اليوم</div>
                </div>
            `;
            countDisplay.innerText = '0 مقيم';
            return;
        }

        countDisplay.innerText = `${todayEntries.length} مقيم في الخدمة`;

        const sortedEntries = [...todayEntries].sort((a, b) => a.specCode.localeCompare(b.specCode));

        container.innerHTML = sortedEntries.map(entry => {
            const resident = db.names.find(n => n.name === entry.name);
            const phone = resident?.phone || "رقم غير متوفر";
            const specName = arabicSpecs[entry.specCode] || entry.specCode;
            const icon = specIcons[entry.specCode] || "🏥";
            const isPhoneValid = phone && phone !== "رقم غير متوفر" && phone.length > 5;
            const cardClass = `card-${entry.specCode.toLowerCase()}` || 'card-default';
            
            return `
                <div class="roster-card ${cardClass}">
                    <div class="card-header">
                        <span class="resident-name">${icon} ${entry.name}</span>
                        <span class="resident-spec">${specName}</span>
                    </div>
                    <div class="resident-phone">${phone}</div>
                    <div class="card-actions">
                        <a href="${isPhoneValid ? 'tel:' + phone : '#'}" 
                           class="action-btn-sm call ${!isPhoneValid ? 'opacity-40 pointer-events-none' : ''}"
                           style="${!isPhoneValid ? 'cursor:default;' : ''}">
                            <span class="icon">📞</span> Call
                        </a>
                        <a href="${isPhoneValid ? 'whatsapp://send?phone=' + phone : '#'}" 
                           class="action-btn-sm wa ${!isPhoneValid ? 'opacity-40 pointer-events-none' : ''}"
                           style="${!isPhoneValid ? 'cursor:default;' : ''}"
                           onclick="${isPhoneValid ? 'event.preventDefault(); window.location.href=this.href;' : 'event.preventDefault();'}">
                            <span class="icon">💬</span> WhatsApp
                        </a>
                    </div>
                </div>
            `;
        }).join('');
    }

    // Expose functions globally
    window.logout = logout;
    window.toggleTheme = toggleTheme;

    document.addEventListener('DOMContentLoaded', function() {
        const container = document.getElementById('passwordContainer');
        if (container) {
            container.addEventListener('click', function() {
                document.getElementById('pw').focus();
            });
        }
    });
</script>
