<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HOSPITAL SCHEDULER 🇮🇶</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&family=IBM+Plex+Sans+Arabic:wght@400;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
    <style>
        /* ----- RESET & BASE ----- */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        :root {
            --bg: #0b0e13;
            --bg-card: #141a24;
            --bg-card-hover: #1c2432;
            --border-subtle: rgba(255, 255, 255, 0.05);
            --border-focus: rgba(255, 255, 255, 0.12);
            --text-primary: #eef2f6;
            --text-secondary: #9aa8b9;
            --text-muted: #5d6f83;
            --nav-h: 64px;
            --radius-card: 1.8rem;
            --radius-input: 0.9rem;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text-secondary);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ============================================================
           NAVIGATION - FIXED TOP
           ============================================================ */
        .nav-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            height: var(--nav-h);
            padding: 0 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(18, 22, 30, 0.92);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-subtle);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .nav-brand h1 {
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: -0.02em;
            color: white;
            background: linear-gradient(135deg, #f0f4ff 0%, #b7c9e2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            white-space: nowrap;
        }

        .nav-brand span {
            font-size: 1.1rem;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .view-selector {
            display: flex;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 2rem;
            padding: 0.1rem;
            border: 1px solid var(--border-subtle);
        }

        .view-btn {
            padding: 0.2rem 0.6rem;
            border-radius: 1.5rem;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.5rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .view-btn:hover {
            color: var(--text-secondary);
        }

        .view-btn.active {
            background: #d4af37;
            color: #0b0e13;
        }

        .month-picker {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            color: #d4dce8;
            padding: 0.25rem 0.7rem;
            border-radius: 2rem;
            font-weight: 600;
            font-size: 0.65rem;
            transition: 0.2s ease;
            cursor: pointer;
            min-width: 110px;
            font-family: inherit;
        }

        .month-picker:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
        }

        .month-picker::-webkit-calendar-picker-indicator {
            filter: invert(0.6);
            cursor: pointer;
        }

        .sync-btn {
            background: #d4af37;
            color: #0b0e13;
            padding: 0.25rem 0.9rem;
            border-radius: 2rem;
            font-weight: 800;
            font-size: 0.55rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            border: none;
            transition: 0.15s ease;
            box-shadow: 0 4px 16px rgba(212, 175, 55, 0.2);
            cursor: pointer;
            white-space: nowrap;
            font-family: inherit;
        }

        .sync-btn:hover {
            transform: scale(0.97);
            opacity: 0.85;
        }

        .sync-btn:active {
            transform: scale(0.94);
        }

        /* ============================================================
           BOARD CONTAINER - FILLS SPACE BELOW NAV
           ============================================================ */
        .board-container {
            position: fixed;
            top: var(--nav-h);
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            gap: 1.2rem;
            padding: 1.2rem 1.5rem 1.5rem 1.5rem;
            overflow-x: auto;
            overflow-y: hidden;
            align-items: flex-start;
            box-sizing: border-box;
            scroll-behavior: smooth;
            background: var(--bg);
        }

        .board-container.all-view {
            overflow-x: auto;
            overflow-y: hidden;
            justify-content: flex-start;
        }

        .board-container.single-view {
            overflow: hidden;
            justify-content: center;
            padding: 1.2rem 0.5rem 1.5rem 0.5rem;
            touch-action: none;
        }

        .board-container::-webkit-scrollbar {
            height: 4px;
        }
        .board-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .board-container::-webkit-scrollbar-thumb {
            background: #2d3745;
            border-radius: 20px;
        }

        /* ============================================================
           SPECIALTY TRACK CARD
           ============================================================ */
        .specialty-track {
            flex: 0 0 auto;
            width: 340px;
            background: var(--bg-card);
            border-radius: var(--radius-card);
            display: flex;
            flex-direction: column;
            height: calc(100vh - var(--nav-h) - 2.8rem);
            border: 1px solid var(--border-subtle);
            box-shadow: 0 20px 40px -20px rgba(0, 0, 0, 0.8);
            transition: border-color 0.2s, box-shadow 0.2s, transform 0.3s ease, opacity 0.3s ease;
            overflow: hidden;
            min-width: 280px;
            max-width: 420px;
        }

        .board-container.all-view .specialty-track {
            flex: 0 0 320px;
            width: 320px;
            min-width: 260px;
            max-width: 380px;
            height: calc(100vh - var(--nav-h) - 2.8rem);
        }

        .board-container.single-view .specialty-track {
            flex: 0 0 94%;
            max-width: 540px;
            min-width: 280px;
            width: 94%;
            height: calc(100vh - var(--nav-h) - 2.8rem);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
        }

        .specialty-track:hover {
            border-color: rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px -20px rgba(0, 0, 0, 0.9), 0 0 20px -8px var(--spec-color);
        }

        .specialty-track.hidden-track {
            display: none;
        }

        /* Slide animations */
        .specialty-track.slide-out-left {
            transform: translateX(-120%) scale(0.9);
            opacity: 0;
        }
        .specialty-track.slide-out-right {
            transform: translateX(120%) scale(0.9);
            opacity: 0;
        }
        .specialty-track.slide-in-left {
            transform: translateX(0) scale(1);
            opacity: 1;
        }
        .specialty-track.slide-in-right {
            transform: translateX(0) scale(1);
            opacity: 1;
        }

        /* ============================================================
           TRACK HEADER - ELEGANT CENTERED
           ============================================================ */
        .track-header {
            padding: 1rem 1.2rem 0.8rem;
            text-align: center;
            flex-shrink: 0;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.02) 0%, transparent 100%);
            border-bottom: 2px solid var(--spec-color);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.8rem;
            position: relative;
        }

        .track-header .spec-icon {
            font-size: 1.4rem;
            line-height: 1;
        }

        .track-header h2 {
            color: var(--spec-color);
            font-weight: 800;
            font-size: 0.95rem;
            letter-spacing: 0.05em;
            margin: 0;
            font-family: 'IBM Plex Sans Arabic', 'Inter', sans-serif;
        }

        .track-header .spec-count {
            font-size: 0.5rem;
            font-weight: 700;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.04);
            padding: 0.1rem 0.6rem;
            border-radius: 1rem;
            border: 1px solid var(--border-subtle);
        }

        .track-nav {
            display: flex;
            gap: 0.3rem;
            position: absolute;
            left: 0.8rem;
            top: 50%;
            transform: translateY(-50%);
        }

        .track-nav button {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            border-radius: 50%;
            width: 26px;
            height: 26px;
            cursor: pointer;
            font-size: 0.7rem;
            transition: 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .track-nav button:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
        }

        /* ============================================================
           DAYS LIST
           ============================================================ */
        .days-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.6rem 0.6rem 1rem;
            scrollbar-width: thin;
            scrollbar-color: #2d3745 transparent;
        }

        .days-list::-webkit-scrollbar {
            width: 3px;
        }
        .days-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .days-list::-webkit-scrollbar-thumb {
            background: #2d3745;
            border-radius: 20px;
        }

        /* ============================================================
           DAY BOX
           ============================================================ */
        .day-box {
            background: rgba(255, 255, 255, 0.015);
            margin-bottom: 0.3rem;
            border-radius: 1rem;
            padding: 0.2rem 0.3rem 0.3rem;
            border: 1px solid transparent;
            transition: background 0.15s, border-color 0.15s;
        }

        .day-box:focus-within {
            border-color: var(--spec-color);
            background: rgba(255, 255, 255, 0.03);
            box-shadow: 0 0 0 1px var(--spec-color);
        }

        .day-box.weekend {
            background: rgba(255, 255, 255, 0.03);
            border-left: 2px solid var(--spec-color);
            border-radius: 1rem 0.3rem 0.3rem 1rem;
        }

        .day-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.55rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            color: var(--text-secondary);
            padding: 0.05rem 0.5rem 0.1rem 0.5rem;
            text-transform: uppercase;
        }

        .day-label .day-date {
            font-weight: 700;
            color: var(--text-primary);
        }

        /* ============================================================
           DUTY SLOTS
           ============================================================ */
        .duty-slots {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .duty-slot {
            display: flex;
            align-items: stretch;
            gap: 0.3rem;
            position: relative;
            min-height: 40px;
        }

        /* ----- Time Display ----- */
        .duty-slot .time-display {
            display: flex;
            flex-direction: column;
            gap: 0.05rem;
            font-size: 0.55rem;
            font-weight: 700;
            color: var(--spec-color, #60a5fa);
            min-width: 52px;
            font-family: 'JetBrains Mono', monospace;
            opacity: 0.9;
            flex-shrink: 0;
            text-align: center;
            background: rgba(255, 255, 255, 0.04);
            padding: 0.2rem 0.25rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: 0.2s ease;
            justify-content: center;
            align-items: center;
            border: 1px solid transparent;
            line-height: 1.3;
        }

        .duty-slot .time-display:hover {
            background: rgba(255, 255, 255, 0.08);
            opacity: 1;
        }

        /* Single slot - 24hr style (non-editable indicator) */
        .duty-slot .time-display.single-slot {
            background: rgba(212, 175, 55, 0.1);
            border-color: rgba(212, 175, 55, 0.15);
            cursor: default;
            opacity: 0.8;
            color: #fbbf24;
        }

        .duty-slot .time-display.single-slot:hover {
            background: rgba(212, 175, 55, 0.1);
            opacity: 0.8;
        }

        .duty-slot .time-display .time-start,
        .duty-slot .time-display .time-end {
            display: block;
            font-size: 0.55rem;
            font-weight: 700;
        }

        .duty-slot .time-display .time-sep {
            opacity: 0.2;
            font-size: 0.4rem;
        }

        .duty-slot .time-display .single-slot-label {
            font-size: 0.35rem;
            opacity: 0.6;
            display: block;
            font-weight: 600;
            color: #fbbf24;
        }

        /* ----- Input Wrapper ----- */
        .duty-slot .input-wrapper {
            flex: 1;
            position: relative;
            direction: rtl;
            text-align: right;
            min-width: 0;
        }

        .duty-slot .cell-input,
        .duty-slot .ghost-text {
            width: 100%;
            font-family: 'IBM Plex Sans Arabic', 'Inter', sans-serif;
            font-size: 0.95rem;
            padding: 0.35rem 0.7rem;
            line-height: 1.5;
            text-align: right;
            box-sizing: border-box;
            white-space: pre-wrap;
            word-wrap: break-word;
            margin: 0;
            border: none;
            font-weight: 600;
            border-radius: 0.7rem;
            min-height: 36px;
            height: auto;
        }

        .duty-slot .cell-input {
            background: transparent;
            outline: none;
            color: #f0f4fc;
            position: relative;
            z-index: 10;
            direction: rtl;
            caret-color: var(--spec-color, #60a5fa);
            min-height: 36px;
            font-size: 0.95rem;
            letter-spacing: 0.02em;
        }

        .duty-slot .cell-input::placeholder {
            color: rgba(255, 255, 255, 0.08);
            font-weight: 400;
            font-size: 0.85rem;
        }

        .duty-slot .ghost-text {
            position: absolute;
            top: 0;
            right: 0;
            color: rgba(255, 255, 255, 0.3);
            z-index: 5;
            pointer-events: none;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            direction: rtl;
            background: transparent;
            font-weight: 500;
            white-space: pre-wrap;
            word-wrap: break-word;
            padding: 0.35rem 0.7rem;
            font-size: 0.95rem;
        }

        .duty-slot .ghost-text .ghost-suggestion {
            color: rgba(255, 255, 255, 0.25);
        }
        .duty-slot .ghost-text .ghost-suggestion-bright {
            color: rgba(255, 255, 255, 0.45);
        }
        .duty-slot .ghost-offset {
            color: transparent;
            visibility: hidden;
            white-space: pre;
        }

        .duty-slot .prefilled {
            color: var(--spec-color) !important;
            font-weight: 700;
        }
        .duty-slot .new-entry {
            color: #ffffff !important;
            font-weight: 700;
        }
        .duty-slot .cell-input.invalid-name {
            color: #ef4444 !important;
            border: 1px solid rgba(239, 68, 68, 0.3);
            background: rgba(239, 68, 68, 0.05);
        }

        /* ----- Dropdown Arrow ----- */
        .duty-slot .dropdown-arrow {
            position: absolute;
            left: 4px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.45rem;
            color: #4b5b70;
            cursor: pointer;
            z-index: 25;
            padding: 3px 6px;
            border-radius: 2rem;
            transition: 0.1s ease;
            background: rgba(0, 0, 0, 0.25);
            line-height: 1;
        }

        .duty-slot .dropdown-arrow:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #b0c4dd;
        }

        /* ----- Custom Menu ----- */
        .duty-slot .custom-menu {
            position: absolute;
            top: calc(100% + 4px);
            right: 0;
            width: 100%;
            max-height: 160px;
            overflow-y: auto;
            background: #1a2230;
            border: 1px solid var(--spec-color, #60a5fa);
            border-radius: 0.8rem;
            z-index: 1000;
            display: none;
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            padding: 0.3rem 0;
        }

        .duty-slot .custom-menu div {
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
            text-align: right;
            cursor: pointer;
            color: #c8d4e3;
            font-weight: 500;
            transition: 0.1s ease;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .duty-slot .custom-menu div:hover {
            background: var(--spec-color, #60a5fa);
            color: #0b0e11;
        }

        .duty-slot .custom-menu::-webkit-scrollbar {
            width: 3px;
        }
        .duty-slot .custom-menu::-webkit-scrollbar-thumb {
            background: #3f4d62;
            border-radius: 20px;
        }

        /* ----- Delete Button ----- */
        .delete-slot-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.08);
            cursor: pointer;
            font-size: 0.6rem;
            padding: 0.15rem 0.35rem;
            border-radius: 0.4rem;
            transition: 0.2s ease;
            flex-shrink: 0;
            line-height: 1;
            align-self: center;
        }

        .delete-slot-btn:hover {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.08);
        }

        /* Hide delete button when only one slot */
        .duty-slots.single-slot .delete-slot-btn {
            display: none !important;
        }

        /* ----- Add Slot Button ----- */
        .add-slot-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.25rem;
            padding: 0.15rem 0.5rem;
            border-radius: 0.6rem;
            border: 1px dashed rgba(255, 255, 255, 0.06);
            background: transparent;
            color: var(--text-muted);
            font-size: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
            width: 100%;
            margin-top: 0.1rem;
            font-family: inherit;
        }

        .add-slot-btn:hover {
            background: rgba(255, 255, 255, 0.03);
            border-color: var(--spec-color, #60a5fa);
            color: var(--spec-color, #60a5fa);
        }

        /* ----- Slot Tip ----- */
        .slot-tip {
            font-size: 0.45rem;
            color: #fbbf24;
            padding: 0.1rem 0.4rem;
            border-radius: 0.4rem;
            background: rgba(251, 191, 36, 0.05);
            border: 1px solid rgba(251, 191, 36, 0.06);
            display: flex;
            align-items: center;
            gap: 0.2rem;
            margin-top: 0.05rem;
            animation: fadeTip 0.3s ease;
            font-weight: 600;
        }

        .slot-tip.error {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.05);
            border-color: rgba(239, 68, 68, 0.06);
        }

        @keyframes fadeTip {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============================================================
           TIME PICKER POPUP
           ============================================================ */
        .time-picker-popup {
            position: fixed;
            background: #1a2230;
            border: 2px solid var(--spec-color, #60a5fa);
            border-radius: 1rem;
            padding: 0.8rem;
            z-index: 9999;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            display: none;
            min-width: 190px;
        }

        .time-picker-popup.active {
            display: block;
        }

        .time-picker-popup .picker-row {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-bottom: 0.3rem;
        }

        .time-picker-popup .picker-row label {
            font-size: 0.55rem;
            font-weight: 600;
            color: var(--text-secondary);
            min-width: 28px;
        }

        .time-picker-popup select {
            background: #0b0e13;
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 0.2rem 0.3rem;
            border-radius: 0.4rem;
            font-size: 0.6rem;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            flex: 1;
        }

        .time-picker-popup select:focus {
            outline: none;
            border-color: var(--spec-color, #60a5fa);
        }

        .time-picker-popup .picker-actions {
            display: flex;
            gap: 0.3rem;
            margin-top: 0.4rem;
            justify-content: flex-end;
        }

        .time-picker-popup .picker-actions button {
            padding: 0.2rem 0.7rem;
            border-radius: 0.5rem;
            border: none;
            font-size: 0.55rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
            font-family: inherit;
        }

        .time-picker-popup .picker-actions .btn-confirm {
            background: var(--spec-color, #60a5fa);
            color: #0b0e11;
        }

        .time-picker-popup .picker-actions .btn-cancel {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
        }

        /* ============================================================
           NAVIGATION ARROWS (Single View)
           ============================================================ */
        .nav-arrows {
            display: none;
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            z-index: 90;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s ease;
            align-items: center;
            justify-content: center;
        }

        .nav-arrows:hover {
            background: rgba(0, 0, 0, 0.7);
            color: var(--text-primary);
        }

        .nav-arrows:active {
            transform: translateY(-50%) scale(0.92);
        }

        .nav-arrows.left { left: 8px; }
        .nav-arrows.right { right: 8px; }

        .board-container.single-view .nav-arrows {
            display: flex;
        }

        /* ============================================================
           TRACK INDICATORS
           ============================================================ */
        .track-indicators {
            display: flex;
            justify-content: center;
            gap: 0.3rem;
            padding: 0.2rem 0;
            position: absolute;
            bottom: 6px;
            left: 50%;
