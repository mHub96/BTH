<body>

    <div id="app-wrapper">
        <!-- ===== FIXED NAVIGATION ===== -->
        <div class="nav-bar">
            <div class="nav-brand">
                <h1>Teaching Hosp.</h1>
                <span>🇮🇶</span>
            </div>
            <div class="nav-actions">
                <div class="view-selector">
                    <button class="view-btn active" data-view="all" onclick="switchView('all')">الكل</button>
                    <button class="view-btn" data-view="single" onclick="switchView('single')">تخصص</button>
                </div>
                <input type="month" id="month-picker" class="month-picker">
                <button onclick="saveToGithub()" id="sync-btn" class="sync-btn">💾 حفظ</button>
            </div>
        </div>

        <!-- ===== BOARD ===== -->
        <div class="board-container all-view" id="board">
            <button class="nav-arrows left" onclick="navigateTrack(-1)">‹</button>
            <button class="nav-arrows right" onclick="navigateTrack(1)">›</button>
            <div class="swipe-hint" id="swipe-hint">↔ اسحب للتنقل</div>
        </div>
    </div>

    <script>
        // ================================================================
        // CONFIGURATION
        // ================================================================
        const CONFIG = {
            user: "mHub96",
            repo: "BTH",
            path: "update/data.json"
        };

        const t1 = "ghp_dAUtsFhTH";
        const t2 = "a2KeJQOsxsC";
        const t3 = "Ct1vz8z1Z63";
        const t4 = "AmsjS";
        const GH_TOKEN = t1 + t2 + t3 + t4;

        let db = { names: [], schedule: [], passwords: {}, specialties: [] };
        let fileSha = "";
        let nameData = {};
        let specialtyList = [];
        let specialtyColorMap = {};
        let currentView = 'all';
        let currentTrackIndex = 0;
        let isTransitioning = false;
        let touchStartX = 0;
        let touchStartY = 0;
        let isSwiping = false;

        // ================================================================
        // INIT
        // ================================================================
        window.onload = async () => {
            const now = new Date();
            const nextMonthDate = new Date(now.getFullYear(), now.getMonth() + 1, 1);
            const picker = document.getElementById('month-picker');
            if (picker) {
                picker.value = `${nextMonthDate.getFullYear()}-${String(nextMonthDate.getMonth() + 1).padStart(2, '0')}`;
                picker.onchange = refreshView;
            }
            await init();
            setupSwipe();
        };

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.custom-menu') && !e.target.closest('.dropdown-arrow')) {
                closeAllMenus();
            }
            if (!e.target.closest('.time-picker-popup') && !e.target.closest('.time-display')) {
                closeTimePicker();
            }
        });

        function closeAllMenus() {
            document.querySelectorAll('.custom-menu').forEach(x => x.style.display = 'none');
        }

        function closeTimePicker() {
            document.querySelectorAll('.time-picker-popup').forEach(x => x.classList.remove('active'));
        }

        // ================================================================
        // SWIPE
        // ================================================================
        function setupSwipe() {
            const board = document.getElementById('board');
            
            board.addEventListener('touchstart', handleTouchStart, { passive: true });
            board.addEventListener('touchmove', handleTouchMove, { passive: true });
            board.addEventListener('touchend', handleTouchEnd, { passive: true });
            
            let isDragging = false;
            let dragStartX = 0;
            
            board.addEventListener('mousedown', (e) => {
                if (currentView !== 'single') return;
                isDragging = true;
                dragStartX = e.clientX;
                board.style.cursor = 'grabbing';
            });
            
            board.addEventListener('mousemove', (e) => {
                if (!isDragging || currentView !== 'single') return;
                const diff = e.clientX - dragStartX;
                if (Math.abs(diff) > 30) {
                    isDragging = false;
                    board.style.cursor = 'default';
                    if (diff > 0) navigateTrack(-1);
                    else navigateTrack(1);
                }
            });
            
            board.addEventListener('mouseup', () => {
                isDragging = false;
                board.style.cursor = 'default';
            });
            
            board.addEventListener('mouseleave', () => {
                isDragging = false;
                board.style.cursor = 'default';
            });
        }

        function handleTouchStart(e) {
            if (currentView !== 'single') return;
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
            isSwiping = false;
        }

        function handleTouchMove(e) {
            if (currentView !== 'single' || touchStartX === 0) return;
            const touch = e.touches[0];
            const diffX = touch.clientX - touchStartX;
            const diffY = touch.clientY - touchStartY;
            
            if (Math.abs(diffX) > 10 && Math.abs(diffX) > Math.abs(diffY) * 1.5) {
                isSwiping = true;
                e.preventDefault();
            }
        }

        function handleTouchEnd(e) {
            if (currentView !== 'single' || touchStartX === 0 || !isSwiping) {
                touchStartX = 0;
                touchStartY = 0;
                isSwiping = false;
                return;
            }
            
            const touch = e.changedTouches[0];
            const diffX = touch.clientX - touchStartX;
            
            if (Math.abs(diffX) > 40) {
                if (diffX > 0) navigateTrack(-1);
                else navigateTrack(1);
            }
            
            touchStartX = 0;
            touchStartY = 0;
            isSwiping = false;
        }

        // ================================================================
        // LOAD DATA
        // ================================================================
        async function init() {
            const wrapper = document.getElementById('app-wrapper');
            if (wrapper) wrapper.classList.add('loading-active');

            try {
                const res = await fetch(`https://api.github.com/repos/${CONFIG.user}/${CONFIG.repo}/contents/${CONFIG.path}?t=${Date.now()}`, {
                    headers: {
                        "Authorization": `token ${GH_TOKEN}`,
                        "Accept": "application/vnd.github.v3+json"
                    }
                });

                if (res.ok) {
                    const data = await res.json();
                    fileSha = data.sha;
                    db = JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\s/g, '')))));
                    db.names = (db.names || []).map(item => {
                        if (Array.isArray(item)) return { name: item[0], spec: item[1] || "NS", phone: "" };
                        return item;
                    });
                    
                    if (!db.passwords) {
                        db.passwords = { user: "12345", admin: "123" };
                    }

                    buildSpecialtyList();
                }
                updateNameLookup();
                refreshView();
            } catch (e) { console.error("Init Error", e); }

            if (wrapper) wrapper.classList.remove('loading-active');
        }

        // ================================================================
        // SPECIALTY LIST
        // ================================================================
        function buildSpecialtyList() {
            specialtyColorMap = {};
            const enabledSpecialties = (db.specialties || []).filter(spec => spec.enabled !== false);
            
            if (enabledSpecialties.length > 0) {
                enabledSpecialties.forEach(spec => {
                    specialtyColorMap[spec.id] = spec.color || '#60a5fa';
                });
                specialtyList = enabledSpecialties.map(spec => ({
                    id: spec.id,
                    name: spec.name_en || spec.name_ar || spec.id,
                    color: spec.color || '#60a5fa',
                    name_ar: spec.name_ar || spec.id,
                    icon: spec.icon || '🏥'
                }));
                return;
            }
            specialtyList = [];
            specialtyColorMap = {};
        }

        function updateNameLookup() {
            nameData = {};
            const residents = db.names || [];
            specialtyList.forEach(s => {
                const specObj = db.specialties?.find(sp => sp.id === s.id);
                const acceptPool = specObj?.acceptPool || [];
                
                if (s.id === "OP" || s.id === "ICU" || s.id === "GA") {
                    nameData[s.id] = residents.filter(x => x.spec === "A").map(x => x.name);
                } else if (s.id === "D") {
                    if (acceptPool.length > 0) {
                        nameData[s.id] = residents.filter(x => acceptPool.includes(x.spec)).map(x => x.name);
                    } else {
                        nameData[s.id] = residents.map(x => x.name);
                    }
                } else {
                    if (acceptPool.length > 0) {
                        nameData[s.id] = residents.filter(x => acceptPool.includes(x.spec)).map(x => x.name);
                    } else {
                        nameData[s.id] = residents.filter(x => x.spec === s.id).map(x => x.name);
                    }
                }
            });
        }

        function getSpecColor(specId) {
            return specialtyColorMap[specId] || '#60a5fa';
        }

        // ================================================================
        // VIEW SWITCHING
        // ================================================================
        function switchView(view) {
            if (isTransitioning) return;
            currentView = view;
            document.querySelectorAll('.view-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.view === view);
            });
            
            const container = document.getElementById('board');
            container.classList.remove('all-view', 'single-view');
            container.classList.add(view === 'all' ? 'all-view' : 'single-view');
            
            const tracks = container.querySelectorAll('.specialty-track');
            if (view === 'all') {
                tracks.forEach((track) => {
                    track.classList.remove('hidden-track', 'slide-out-left', 'slide-out-right');
                    track.style.display = '';
                });
                document.querySelector('.swipe-hint').style.display = 'none';
            } else {
                tracks.forEach((track, index) => {
                    if (index === currentTrackIndex) {
                        track.classList.remove('hidden-track', 'slide-out-left', 'slide-out-right');
                        track.style.display = '';
                        track.classList.add('slide-in-left');
                    } else {
                        track.classList.add('hidden-track');
                        track.style.display = 'none';
                    }
                });
                document.querySelector('.swipe-hint').style.display = 'block';
                setTimeout(() => {
                    const visibleTrack = container.querySelector('.specialty-track:not(.hidden-track)');
                    if (visibleTrack) {
                        visibleTrack.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 100);
            }
            updateIndicators();
        }

        function navigateTrack(direction) {
            if (isTransitioning || currentView !== 'single' || specialtyList.length === 0) return;
            
            const totalTracks = specialtyList.length;
            const newIndex = (currentTrackIndex + direction + totalTracks) % totalTracks;
            if (newIndex === currentTrackIndex) return;
            
            isTransitioning = true;
            const container = document.getElementById('board');
            const tracks = container.querySelectorAll('.specialty-track');
            const currentTrack = tracks[currentTrackIndex];
            const nextTrack = tracks[newIndex];
            
            if (!currentTrack || !nextTrack) {
                isTransitioning = false;
                return;
            }
            
            nextTrack.classList.remove('hidden-track');
            nextTrack.style.display = '';
            nextTrack.classList.add(direction > 0 ? 'slide-out-right' : 'slide-out-left');
            currentTrack.classList.add(direction > 0 ? 'slide-out-left' : 'slide-out-right');
            
            setTimeout(() => {
                currentTrack.classList.add('hidden-track');
                currentTrack.style.display = 'none';
                currentTrack.classList.remove('slide-out-left', 'slide-out-right');
                nextTrack.classList.remove('slide-out-left', 'slide-out-right');
                nextTrack.classList.add('slide-in-left');
                currentTrackIndex = newIndex;
                updateIndicators();
                setTimeout(() => {
                    nextTrack.classList.remove('slide-in-left');
                    isTransitioning = false;
                }, 300);
            }, 350);
        }

        function updateIndicators() {
            const container = document.getElementById('board');
            const existing = container.querySelector('.track-indicators');
            if (existing) existing.remove();
            
            if (currentView !== 'single' || specialtyList.length <= 1) return;
            
            const indicators = document.createElement('div');
            indicators.className = 'track-indicators';
            specialtyList.forEach((_, index) => {
                const dot = document.createElement('span');
                dot.className = `dot ${index === currentTrackIndex ? 'active' : ''}`;
                dot.style.setProperty('--spec-color', getSpecColor(specialtyList[index].id));
                dot.onclick = () => {
                    const diff = index - currentTrackIndex;
                    if (diff !== 0) navigateTrack(diff > 0 ? 1 : -1);
                };
                indicators.appendChild(dot);
            });
            container.appendChild(indicators);
        }

        // ================================================================
        // TIME UTILITIES - EQUAL DIVISION WITH CROSS-DAY HANDLING
        // ================================================================
        const DAY_START = 8;

        function minutesToTimeStr(minutes) {
            const totalMinutes = minutes + (DAY_START * 60);
            const hrs = Math.floor(totalMinutes / 60) % 24;
            const mins = totalMinutes % 60;
            const ampm = hrs >= 12 ? 'PM' : 'AM';
            const h12 = hrs % 12 || 12;
            return `${String(h12).padStart(2, '0')}:${String(mins).padStart(2, '0')}${ampm}`;
        }

        function timeStrToMinutes(str) {
            const match = str.match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
            if (!match) return null;
            let hrs = parseInt(match[1]);
            const mins = parseInt(match[2]);
            const ampm = match[3].toUpperCase();
            if (ampm === 'PM' && hrs !== 12) hrs += 12;
            if (ampm === 'AM' && hrs === 12) hrs = 0;
            let total = hrs * 60 + mins;
            if (total < DAY_START * 60) total += 24 * 60;
            return total - (DAY_START * 60);
        }

        function formatDutyTime(startMin, endMin) {
            // Handle cross-day: if endMin <= startMin, add 24 hours
            let endAdjusted = endMin;
            if (endMin <= startMin) {
                endAdjusted = endMin + (24 * 60);
            }
            return `${minutesToTimeStr(startMin)} - ${minutesToTimeStr(endAdjusted)}`;
        }

        function parseDutyTime(dutyTimeStr) {
            if (!dutyTimeStr) return null;
            const parts = dutyTimeStr.split(' - ');
            if (parts.length !== 2) return null;
            const start = timeStrToMinutes(parts[0].trim());
            const end = timeStrToMinutes(parts[1].trim());
            if (start === null || end === null) return null;
            return { start, end };
        }

        // ================================================================
        // EQUAL DIVISION OF TIME
        // ================================================================
        function calculateSlotTimes(numSlots, customOverrides = {}) {
            if (numSlots === 0) return [];
            const totalDuration = 24 * 60;
            
            // For 1 slot: full 24 hours
            if (numSlots === 1) return [{ start: 0, end: totalDuration }];
            
            // For multiple slots: divide equally
            const slotDuration = totalDuration / numSlots;
            const results = [];
            
            for (let i = 0; i < numSlots; i++) {
                let start = Math.round(i * slotDuration);
                let end = Math.round((i + 1) * slotDuration);
                
                // Check if there's a custom override for this slot
                const key = `slot_${i}`;
                if (customOverrides[key]) {
                    const custom = customOverrides[key];
                    if (custom.start !== undefined && custom.end !== undefined) {
                        // Allow custom times, handling cross-day
                        let adjustedEnd = custom.end;
                        if (custom.end <= custom.start) {
                            adjustedEnd = custom.end + totalDuration;
                        }
                        if (custom.start >= 0 && custom.start < totalDuration && adjustedEnd > custom.start) {
                            start = custom.start;
                            end = adjustedEnd;
                        }
                    }
                }
                results.push({ start, end });
            }
            return results;
        }

        function normalizeDayEntries(date, specCode) {
            const entries = (db.schedule || []).filter(s => s.date === date && s.specCode === specCode);
            entries.sort((a, b) => (a.dutySlot || 0) - (b.dutySlot || 0));
            entries.forEach((entry, idx) => { entry.dutySlot = idx; });
            return entries;
        }

        function recalculateDaySlotTimes(date, specCode) {
            const entries = normalizeDayEntries(date, specCode);
            if (entries.length === 0) return [];

            const timeOverrides = {};
            entries.forEach((entry, idx) => {
                if (entry.dutyTime) {
                    const parsed = parseDutyTime(entry.dutyTime);
                    if (parsed) timeOverrides[`slot_${idx}`] = parsed;
                }
            });

            const calculatedTimes = calculateSlotTimes(entries.length, timeOverrides);
            entries.forEach((entry, idx) => {
                if (entries.length === 1) {
                    entry.dutyTime = '';
                    return;
                }
                const timeData = calculatedTimes[idx] || { start: 0, end: 24 * 60 };
                entry.dutyTime = formatDutyTime(timeData.start, timeData.end);
            });

            return calculatedTimes;
        }

        function validateSlotTimes(slots) {
            if (slots.length <= 1) return { valid: true, gaps: [], overlaps: false };
            
            const totalDuration = 24 * 60;
            const sorted = [...slots].sort((a, b) => a.start - b.start);
            const gaps = [];
            
            // Allow 1-2 minute tolerance for rounding
            const TOLERANCE = 2;
            
            if (sorted[0].start > TOLERANCE) {
                gaps.push({ start: 0, end: sorted[0].start });
            }
            
            for (let i = 0; i < sorted.length - 1; i++) {
                const gap = sorted[i + 1].start - sorted[i].end;
                if (gap > TOLERANCE) {
                    gaps.push({ start: sorted[i].end, end: sorted[i + 1].start });
                }
            }
            
            const lastEnd = sorted[sorted.length - 1].end;
            if (lastEnd < totalDuration - TOLERANCE) {
                gaps.push({ start: lastEnd, end: totalDuration });
            }
            
            return { valid: gaps.length === 0, gaps, overlaps: false };
        }

        function autoCorrectSlotTimes(slots) {
            if (slots.length <= 1) return [{ start: 0, end: 24 * 60 }];
            const totalDuration = 24 * 60;
            const slotDuration = totalDuration / slots.length;
            return slots.map((_, i) => ({
                start: Math.round(i * slotDuration),
                end: Math.round((i + 1) * slotDuration)
            }));
        }

        function getDaySlots(date, specCode) {
            const entries = (db.schedule || []).filter(s => s.date === date && s.specCode === specCode);
            return entries.map((entry, index) => {
                let dutyTime = entry.dutyTime || null;
                let timeData = null;
                if (dutyTime) {
                    timeData = parseDutyTime(dutyTime);
                }
                return {
                    index,
                    name: entry.name,
                    dutyTime,
                    timeData,
                    visitCount: entry.VisitCount || 0,
                    raw: entry
                };
            });
        }

        // ================================================================
        // BUILD BOARD
        // ================================================================
        function generateBoard() {
            const picker = document.getElementById('month-picker');
            if (!picker) return;
            const [yr, mon] = picker.value.split('-').map(Number);
            const days = new Date(yr, mon, 0).getDate();
            const board = document.getElementById('board');
            
            const arrows = board.querySelectorAll('.nav-arrows');
            const swipeHint = board.querySelector('.swipe-hint');
            board.innerHTML = '';
            arrows.forEach(arrow => board.appendChild(arrow));
            if (swipeHint) board.appendChild(swipeHint);

            if (specialtyList.length === 0) {
                board.innerHTML = `
                    <div style="width:100%; display:flex; justify-content:center; align-items:center; height:100%;">
                        <div style="text-align:center; color: #5d6f83; padding: 2rem;">
                            <div style="font-size: 3rem; margin-bottom: 1rem;">🔒</div>
                            <div style="font-weight: 700; font-size: 1.1rem; color: #9aa8b9;">لا توجد تخصصات مفعلة</div>
                            <div style="font-size: 0.7rem; margin-top: 0.5rem; opacity: 0.5;">يرجى التواصل مع المسؤول</div>
                        </div>
                    </div>
                `;
                return;
            }

            const isSingleView = currentView === 'single';

            specialtyList.forEach((spec, trackIdx) => {
                const specColor = getSpecColor(spec.id);
                const track = document.createElement('div');
                track.className = `specialty-track`;
                track.style.setProperty('--spec-color', specColor);
                track.dataset.trackIndex = trackIdx;
                
                if (isSingleView && trackIdx !== currentTrackIndex) {
                    track.classList.add('hidden-track');
                    track.style.display = 'none';
                }
                
                const totalResidents = nameData[spec.id]?.length || 0;
                
                let html = `
                    <div class="track-header" style="border-bottom-color: ${specColor};">
                        <span class="spec-icon">${spec.icon || '🏥'}</span>
                        <h2 style="color: ${specColor};">${spec.name_ar || spec.name}</h2>
                        <span class="spec-count">${totalResidents} مقيم</span>
                        ${isSingleView ? `
                            <div class="track-nav">
                                <button onclick="event.stopPropagation(); navigateTrack(-1)">‹</button>
                                <button onclick="event.stopPropagation(); navigateTrack(1)">›</button>
                            </div>
                        ` : ''}
                    </div>
                    <div class="days-list">
                `;
                
                for (let d = 1; d <= days; d++) {
                    const dateObj = new Date(yr, mon - 1, d);
                    const dayName = new Intl.DateTimeFormat('ar-IQ', { weekday: 'short' }).format(dateObj);
                    const dateFull = `${String(d).padStart(2, '0')}/${String(mon).padStart(2, '0')}/${yr}`;
                    const uid = `${String(d).padStart(2, '0')}-${spec.id}`;
                    const isWeekend = (dateObj.getDay() === 5 || dateObj.getDay() === 6);
                    
                    const slots = getDaySlots(dateFull, spec.id);
                    const numSlots = slots.length;
                    const isSingleSlot = numSlots === 1;
                    
                    html += `
                        <div class="day-box ${isWeekend ? 'weekend' : ''}" style="${isWeekend ? `border-left-color: ${specColor};` : ''}" data-day="${dateFull}" data-spec="${spec.id}">
                            <div class="day-label">
                                <span class="day-date">${dateFull.substring(0,5)}</span>
                                <span>${dayName}</span>
                            </div>
                            <div class="duty-slots ${isSingleSlot ? 'single-slot' : ''}" id="slots-${uid}">
                    `;
                    
                    if (numSlots === 0) {
                        html += `
                            <div class="duty-slot" data-slot-index="0">
                                <div class="time-display" style="opacity:0.2; min-width:38px; font-size:0.4rem;">—</div>
                                <div class="input-wrapper" onclick="event.stopPropagation()">
                                    <div class="ghost-text" id="ghost-${uid}-0"></div>
                                    <input type="text" class="cell-input" id="input-${uid}-0"
                                        style="caret-color: ${specColor};"
                                        onfocus="closeAllMenus()"
                                        oninput="handleAC(this, '${spec.id}', '${uid}-0')"
                                        onkeydown="handleKeys(event, this, '${uid}-0')"
                                        onblur="handleBlur('${uid}-0')"
                                        data-date="${dateFull}" data-spec="${spec.id}" data-slot="0" autocomplete="off" placeholder=" ">
                                    <span class="dropdown-arrow" onclick="toggleMenu(event, '${uid}-0', '${spec.id}')">▼</span>
                                    <div class="custom-menu" id="menu-${uid}-0" style="border-color: ${specColor};"></div>
                                </div>
                                <button class="delete-slot-btn" onclick="deleteSlot('${dateFull}', '${spec.id}', 0)" style="display:none;">✕</button>
                            </div>
                        `;
                    } else {
                        // Auto-calculate times based on number of slots (EQUAL DIVISION)
                        const timeOverrides = {};
                        slots.forEach((slot, idx) => {
                            if (slot.timeData) {
                                timeOverrides[`slot_${idx}`] = slot.timeData;
                            }
                        });
                        
                        let calculatedTimes = calculateSlotTimes(numSlots, timeOverrides);
                        const validation = validateSlotTimes(calculatedTimes);
                        if (!validation.valid || validation.overlaps) {
                            calculatedTimes = autoCorrectSlotTimes(calculatedTimes);
                        }
                        
                        slots.forEach((slot, idx) => {
                            const timeData = calculatedTimes[idx] || { start: 0, end: 24 * 60 };
                            const slotUid = `${uid}-${idx}`;
                            const isValidName = nameData[spec.id]?.includes(slot.name) || false;
                            
                            const isSingle = numSlots === 1;
                            const timeDisplayClass = isSingle ? 'time-display single-slot' : 'time-display';
                            const onClickTime = isSingle ? '' : `onclick="openTimePicker(event, '${dateFull}', '${spec.id}', ${idx})"`;
                            
                            let displayStart = timeData.start;
                            let displayEnd = timeData.end;
                            const totalDuration = 24 * 60;
                            if (displayEnd <= displayStart) {
                                displayEnd = displayEnd + totalDuration;
                            }
                            
                            const timeDisplayHtml = isSingle
                                ? `<div class="${timeDisplayClass}" aria-label="24h"><span class="single-slot-label">24h</span></div>`
                                : `<div class="${timeDisplayClass}" ${onClickTime}>
                                    <span class="time-start">${minutesToTimeStr(displayStart)}</span>
                                    <span class="time-sep">—</span>
                                    <span class="time-end">${minutesToTimeStr(displayEnd)}</span>
                                </div>`;
                            
                            html += `
                                <div class="duty-slot" data-slot-index="${idx}">
                                    ${timeDisplayHtml}
                                    <div class="input-wrapper" onclick="event.stopPropagation()">
                                        <div class="ghost-text" id="ghost-${slotUid}"></div>
                                        <input type="text" class="cell-input ${slot.name && !isValidName ? 'invalid-name' : 'prefilled'}" 
                                            id="input-${slotUid}"
                                            style="caret-color: ${specColor};"
                                            onfocus="closeAllMenus()"
                                            oninput="handleAC(this, '${spec.id}', '${slotUid}')"
                                            onkeydown="handleKeys(event, this, '${slotUid}')"
                                            onblur="handleBlur('${slotUid}')"
                                            data-date="${dateFull}" data-spec="${spec.id}" data-slot="${idx}" autocomplete="off" 
                                            value="${slot.name || ''}">
                                        <span class="dropdown-arrow" onclick="toggleMenu(event, '${slotUid}', '${spec.id}')">▼</span>
                                        <div class="custom-menu" id="menu-${slotUid}" style="border-color: ${specColor};"></div>
                                    </div>
                                    <button class="delete-slot-btn" onclick="deleteSlot('${dateFull}', '${spec.id}', ${idx})">✕</button>
                                </div>
                            `;
                        });
                        
                        if (!validation.valid || validation.gaps.length > 0) {
                            const gapText = validation.gaps.map(g => 
                                `${minutesToTimeStr(g.start)} - ${minutesToTimeStr(g.end)}`
                            ).join(', ');
                            html += `
                                <div class="slot-tip error" id="tip-${uid}">
                                    ⚠️ فجوات: ${gapText}
                                </div>
                            `;
                        }
                    }
                    
                    html += `
                            </div>
                            <button class="add-slot-btn" onclick="addSlot('${dateFull}', '${spec.id}')">
                                <i class="fas fa-plus"></i> إضافة خفير
                            </button>
                        </div>
                    `;
                }
                
                track.innerHTML = html + `</div>`;
                board.appendChild(track);
            });

            updateIndicators();
        }

        // ================================================================
        // TIME PICKER
        // ================================================================
        function openTimePicker(event, date, specCode, slotIndex) {
            event.stopPropagation();
            
            const entries = (db.schedule || []).filter(s => s.date === date && s.specCode === specCode);
            if (entries.length <= 1) {
                showToast('⏰ الوقت ثابت لـ 24 ساعة (خفير واحد)', 'info', 2000);
                return;
            }
            
            closeTimePicker();
            
            const specColor = getSpecColor(specCode);
            if (slotIndex >= entries.length) return;
            
            const entry = entries[slotIndex];
            let startMin = 0, endMin = 24 * 60;
            
            if (entry.dutyTime) {
                const parsed = parseDutyTime(entry.dutyTime);
                if (parsed) {
                    startMin = parsed.start;
                    endMin = parsed.end;
                }
            } else {
                const numSlots = entries.length;
                const slotDuration = (24 * 60) / numSlots;
                startMin = slotIndex * slotDuration;
                endMin = (slotIndex + 1) * slotDuration;
            }
            
            const popup = document.createElement('div');
            popup.className = 'time-picker-popup active';
            popup.style.setProperty('--spec-color', specColor);
            popup.style.borderColor = specColor;
            
            const rect = event.target.getBoundingClientRect();
            popup.style.left = Math.min(rect.left + rect.width / 2 - 100, window.innerWidth - 220) + 'px';
            popup.style.top = Math.min(rect.bottom + 8, window.innerHeight - 250) + 'px';
            
            const timeOptions = [];
            for (let h = 0; h < 24; h++) {
                for (let m = 0; m < 60; m += 30) {
                    const totalMin = h * 60 + m;
                    const display = minutesToTimeStr(totalMin - (DAY_START * 60));
                    timeOptions.push({ value: totalMin - (DAY_START * 60), display });
                }
            }
            
            const startVal = Math.round(startMin);
            const endVal = Math.round(endMin);
            
            popup.innerHTML = `
                <div class="picker-row">
                    <label>من</label>
                    <select class="picker-start">
                        ${timeOptions.map(opt => 
                            `<option value="${opt.value}" ${Math.round(opt.value) === startVal ? 'selected' : ''}>${opt.display}</option>`
                        ).join('')}
                    </select>
                </div>
                <div class="picker-row">
                    <label>إلى</label>
                    <select class="picker-end">
                        ${timeOptions.map(opt => 
                            `<option value="${opt.value}" ${Math.round(opt.value) === endVal ? 'selected' : ''}>${opt.display}</option>`
                        ).join('')}
                    </select>
                </div>
                <div class="picker-actions">
                    <button class="btn-cancel" onclick="closeTimePicker()">إلغاء</button>
                    <button class="btn-confirm" onclick="confirmTimePicker(this.closest('.time-picker-popup'), '${date}', '${specCode}', ${slotIndex})">تأكيد</button>
                </div>
            `;
            document.body.appendChild(popup);
        }

        function confirmTimePicker(popup, date, specCode, slotIndex) {
            const startSelect = popup.querySelector('.picker-start');
            const endSelect = popup.querySelector('.picker-end');
            const startVal = parseFloat(startSelect.value);
            const endVal = parseFloat(endSelect.value);
            
            // Allow cross-day: end can be <= start (meaning it continues to next day)
            // Only show error if start == end (0 duration)
            if (startVal === endVal) {
                showToast('❌ مدة الخفير لا يمكن أن تكون صفر', 'error', 2000);
                return;
            }
            
            const entries = (db.schedule || []).filter(s => s.date === date && s.specCode === specCode);
            if (slotIndex >= entries.length) {
                closeTimePicker();
                return;
            }
            
            const entry = entries[slotIndex];
            entry.dutyTime = formatDutyTime(startVal, endVal);
            
            // Recalculate all times for the day based on custom overrides
            const allSlots = (db.schedule || []).filter(s => s.date === date && s.specCode === specCode);
            const timeOverrides = {};
            allSlots.forEach((s, idx) => {
                if (s.dutyTime) {
                    const p = parseDutyTime(s.dutyTime);
                    if (p) timeOverrides[`slot_${idx}`] = p;
                }
            });
            
            const numSlots = allSlots.length;
            const calculatedTimes = calculateSlotTimes(numSlots, timeOverrides);
            const validation = validateSlotTimes(calculatedTimes);
            
            // Apply the recalculated times to all slots
            allSlots.forEach((s, idx) => {
                const timeData = calculatedTimes[idx] || { start: 0, end: 24 * 60 };
                s.dutyTime = formatDutyTime(timeData.start, timeData.end);
            });
            
            closeTimePicker();
            refreshView();
            
            if (!validation.valid || validation.gaps.length > 0) {
                showToast(`⚠️ فجوات: ${validation.gaps.map(g => formatDutyTime(g.start, g.end)).join(', ')}`, 'error', 3000);
            } else {
                showToast('✅ تم تحديث الوقت', 'success', 1500);
            }
        }

        // ================================================================
        // ADD / DELETE SLOT - AUTO DIVIDE TIME EQUALLY
        // ================================================================
        function addSlot(date, specCode) {
            const entries = normalizeDayEntries(date, specCode);
            const newIndex = entries.length;
            const newEntry = {
                date: date,
                specCode: specCode,
                name: "",
                VisitCount: 0,
                dutyTime: "",
                dutySlot: newIndex
            };
            db.schedule.push(newEntry);

            const allEntries = normalizeDayEntries(date, specCode);
            if (allEntries.length > 0) {
                recalculateDaySlotTimes(date, specCode);
            }

            pendingFocusDate = date;
            pendingFocusSpec = specCode;
            pendingFocusSlot = newIndex;
            refreshView();

            setTimeout(() => {
                const input = document.querySelector(`input[data-date="${date}"][data-spec="${specCode}"][data-slot="${newIndex}"]`);
                if (input) {
                    input.focus();
                    input.select();
                    input.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }, 120);
            showToast('✅ تم إضافة خفير', 'success', 1500);
        }

        function deleteSlot(date, specCode, slotIndex) {
            const entries = (db.schedule || []).filter(s => s.date === date && s.specCode === specCode);
            if (slotIndex >= entries.length) return;
            
            const entryToRemove = entries[slotIndex];
            const idx = db.schedule.indexOf(entryToRemove);
            if (idx !== -1) db.schedule.splice(idx, 1);
            
            const remaining = (db.schedule || []).filter(s => s.date === date && s.specCode === specCode);
            remaining.forEach((entry, idx) => { entry.dutySlot = idx; });
            
            if (remaining.length > 0) {
                recalculateDaySlotTimes(date, specCode);
            }
            
            refreshView();
            showToast('🗑️ تم حذف الخفير', 'info', 1500);
        }

        // ================================================================
        // RENDER DATA
        // ================================================================
        function renderData() {
            const picker = document.getElementById('month-picker');
            if (!picker) return;
            const [yr, mon] = picker.value.split('-');
            
            const inputs = document.querySelectorAll('.cell-input');
            inputs.forEach(input => {
                const date = input.dataset.date;
                const specCode = input.dataset.spec;
                const slotIdx = parseInt(input.dataset.slot) || 0;
                
                if (date && date.endsWith(`${mon}/${yr}`)) {
                    const entries = (db.schedule || []).filter(s => s.date === date && s.specCode === specCode);
                    if (slotIdx < entries.length) {
                        const entry = entries[slotIdx];
                        const isValidName = nameData[specCode]?.includes(entry.name) || false;
                        input.value = entry.name || '';
                        if (entry.name) {
                            if (!isValidName && entry.name.trim() !== '') {
                                input.classList.add('invalid-name');
                                input.classList.remove('prefilled');
                            } else {
                                input.classList.add('prefilled');
                                input.classList.remove('invalid-name');
                            }
                        } else {
                            input.classList.remove('prefilled', 'invalid-name');
                        }
                        
                        const slotUid = `${date.split('/')[0]}-${specCode}-${slotIdx}`;
                        const timeDisplay = document.querySelector(`#slots-${date.split('/')[0]}-${specCode} .duty-slot[data-slot-index="${slotIdx}"] .time-display`);
                        if (timeDisplay && entry.dutyTime) {
                            const parsed = parseDutyTime(entry.dutyTime);
                            if (parsed) {
                                if (entries.length === 1) {
                                    timeDisplay.innerHTML = '<span class="single-slot-label">24h</span>';
                                } else {
                                    const startEl = timeDisplay.querySelector('.time-start');
                                    const endEl = timeDisplay.querySelector('.time-end');
                                    let displayStart = parsed.start;
                                    let displayEnd = parsed.end;
                                    if (displayEnd <= displayStart) {
                                        displayEnd = displayEnd + (24 * 60);
                                    }
                                    if (startEl) startEl.textContent = minutesToTimeStr(displayStart);
                                    if (endEl) endEl.textContent = minutesToTimeStr(displayEnd);
                                }
                            }
                        }
                    } else {
                        input.value = '';
                        input.classList.remove('prefilled', 'invalid-name');
                    }
                }
            });
            
            // Update single-slot indicators
            document.querySelectorAll('.duty-slots').forEach(container => {
                const slots = container.querySelectorAll('.duty-slot');
                const isSingle = slots.length === 1;
                container.classList.toggle('single-slot', isSingle);
                
                if (isSingle) {
                    const timeDisplay = container.querySelector('.time-display');
                    if (timeDisplay) {
                        timeDisplay.classList.add('single-slot');
                        const start = timeDisplay.querySelector('.time-start');
                        const end = timeDisplay.querySelector('.time-end');
                        if (start && end) {
                            start.textContent = '08:00AM';
                            end.textContent = '08:00AM';
                        }
                        if (!timeDisplay.querySelector('.single-slot-label')) {
                            const label = document.createElement('span');
                            label.className = 'single-slot-label';
                            label.textContent = '24h';
                            timeDisplay.appendChild(label);
                        }
                    }
                } else {
                    const timeDisplay = container.querySelector('.time-display');
                    if (timeDisplay) {
                        timeDisplay.classList.remove('single-slot');
                        const label = timeDisplay.querySelector('.single-slot-label');
                        if (label) label.remove();
                    }
                }
            });
        }

        // ================================================================
        // INPUT LOGIC - ENTER KEY MOVES TO NEXT CELL
        // ================================================================
        function handleAC(el, sid, uid) {
            const ghost = document.getElementById(`ghost-${uid}`);
            const val = el.value;
            ghost.innerHTML = "";
            ghost.removeAttribute('data-full');
            el.classList.remove('prefilled', 'invalid-name');
            
            if (!val.trim()) { 
                el.classList.remove('new-entry'); 
                return; 
            }
            el.classList.add('new-entry');

            const validNames = nameData[sid] || [];
            if (validNames.length > 0) {
                const match = validNames.find(n => {
                    const nClean = n.toLowerCase().replace(/^د\.\s*/, "").trim();
                    const valClean = val.toLowerCase().replace(/^د\.\s*/, "").trim();
                    return n.toLowerCase().startsWith(val.toLowerCase()) || nClean.startsWith(valClean);
                });
                if (match) {
                    ghost.setAttribute('data-full', match);
                    let display = val.startsWith("د.") ? match : match.replace(/^د\.\s*/, "");
                    if (display.toLowerCase().startsWith(val.toLowerCase())) {
                        ghost.innerHTML = `<span class="ghost-offset">${val}</span><span class="ghost-suggestion-bright">${display.substring(val.length)}</span>`;
                    } else { 
                        ghost.innerHTML = `<span class="ghost-suggestion">${display}</span>`;
                    }
                } else {
                    const exactMatch = validNames.find(n => n.toLowerCase() === val.toLowerCase());
                    if (exactMatch) {
                        ghost.setAttribute('data-full', exactMatch);
                        ghost.innerHTML = `<span class="ghost-suggestion-bright">${exactMatch}</span>`;
                    }
                }
            }
        }

        function handleKeys(e, el, uid) {
            if (e.key === "Enter") {
                e.preventDefault();
                e.stopPropagation();
                
                const date = el.dataset.date;
                const specCode = el.dataset.spec;
                const slotIdx = parseInt(el.dataset.slot) || 0;
                
                // Get next cell info BEFORE DOM is rebuilt
                const nextCell = getNextCellInfo(date, specCode, slotIdx);
                
                // Check if there's a ghost suggestion
                const ghost = document.getElementById(`ghost-${uid}`);
                const full = ghost ? ghost.getAttribute('data-full') : null;
                if (full && el.value.trim() !== full) {
                    el.value = full;
                    el.classList.add('new-entry');
                    el.classList.remove('invalid-name');
                    if (ghost) ghost.innerHTML = "";
                    
                    // Set pending focus BEFORE saveEntry rebuilds the DOM
                    if (nextCell) {
                        pendingFocusDate = nextCell.date;
                        pendingFocusSpec = nextCell.spec;
                        pendingFocusSlot = nextCell.slot;
                    }
                    saveEntry(el);
                } else if (el.value.trim()) {
                    // Set pending focus BEFORE saveEntry rebuilds the DOM
                    if (nextCell) {
                        pendingFocusDate = nextCell.date;
                        pendingFocusSpec = nextCell.spec;
                        pendingFocusSlot = nextCell.slot;
                    }
                    saveEntry(el);
                } else {
                    // Empty field - just move to next
                    moveToNextCell(date, specCode, slotIdx);
                }
                return false;
            }
        }
        
        function getNextCellInfo(date, specCode, currentSlot) {
            // Get ALL inputs for this specialty
            const allInputs = Array.from(document.querySelectorAll(`input[data-spec="${specCode}"]`));
            
            // Find the current input
            const currentInput = allInputs.find(inp => 
                inp.dataset.date === date && 
                parseInt(inp.dataset.slot) === currentSlot
            );
            
            if (!currentInput) return null;
            
            // Get index and find next
            const currentIndex = allInputs.indexOf(currentInput);
            if (currentIndex + 1 < allInputs.length) {
                const nextInput = allInputs[currentIndex + 1];
                return {
                    date: nextInput.dataset.date,
                    spec: nextInput.dataset.spec,
                    slot: parseInt(nextInput.dataset.slot)
                };
            }
            
            return null;
        }

        function moveToNextCell(date, specCode, currentSlot) {
            // Get ALL inputs for this specialty in document order
            const allInputs = Array.from(document.querySelectorAll(`input[data-spec="${specCode}"]`));
            
            // Find the current input by matching date AND slot
            const currentInput = allInputs.find(inp => 
                inp.dataset.date === date && 
                parseInt(inp.dataset.slot) === currentSlot
            );
            
            if (!currentInput) return;
            
            // Get index of current input
            const currentIndex = allInputs.indexOf(currentInput);
            
            // Move to next input if it exists
            if (currentIndex + 1 < allInputs.length) {
                const nextInput = allInputs[currentIndex + 1];
                nextInput.focus();
                nextInput.select();
                nextInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
                return;
            }
            
            // If no next input, stay on current and select all
            if (currentInput) {
                currentInput.focus();
                currentInput.select();
            }
        }

        function toggleMenu(e, uid, sid) {
            e.stopPropagation();
            const m = document.getElementById(`menu-${uid}`);
            const open = m.style.display === "block";
            closeAllMenus();
            if (!open) {
                const specColor = getSpecColor(sid);
                m.style.borderColor = specColor;
                const validNames = nameData[sid] || [];
                if (validNames.length === 0) {
                    m.innerHTML = `<div style="color:#5d6f83;font-size:0.55rem;text-align:center;padding:0.4rem;">لا يوجد مقيمين</div>`;
                } else {
                    m.innerHTML = validNames.map(n => 
                        `<div onmousedown="selectName('${uid}', '${n}')">${n}</div>`
                    ).join('');
                }
                m.style.display = "block";
            }
        }

        function selectName(uid, name) {
            const i = document.getElementById(`input-${uid}`);
            if (i) {
                i.value = name;
                i.classList.add('new-entry');
                i.classList.remove('invalid-name');
                const g = document.getElementById(`ghost-${uid}`);
                if (g) g.innerHTML = "";
                saveEntry(i);
                // After selecting from menu, move to next cell
                const date = i.dataset.date;
                const specCode = i.dataset.spec;
                const slotIdx = parseInt(i.dataset.slot) || 0;
                setTimeout(() => {
                    moveToNextCell(date, specCode, slotIdx);
                }, 100);
            }
            closeAllMenus();
        }

        function handleBlur(uid) {
            // Don't handle blur if we're in the middle of a DOM refresh/focus transition
            if (isRefreshing || pendingFocusDate !== null) {
                return;
            }
            
            setTimeout(() => {
                const g = document.getElementById(`ghost-${uid}`);
                const input = document.getElementById(`input-${uid}`);
                if (g && g.getAttribute('data-full') && input && input.value !== "") {
                    const fullName = g.getAttribute('data-full');
                    input.value = fullName;
                    input.classList.add('new-entry');
                    input.classList.remove('invalid-name');
                    saveEntry(input);
                } else if (input && input.value.trim() !== "") {
                    const specCode = input.dataset.spec;
                    const validNames = nameData[specCode] || [];
                    const isValid = validNames.some(n => n.toLowerCase() === input.value.trim().toLowerCase());
                    if (!isValid) {
                        input.classList.add('invalid-name');
                        input.classList.remove('prefilled', 'new-entry');
                        showToast(`⚠️ "${input.value.trim()}" غير موجود`, 'error', 2000);
                        setTimeout(() => {
                            if (input && input.classList.contains('invalid-name')) {
                                input.value = '';
                                input.classList.remove('invalid-name');
                                const date = input.dataset.date;
                                const specCode = input.dataset.spec;
                                const slotIdx = parseInt(input.dataset.slot) || 0;
                                const entries = (db.schedule || []).filter(s => s.date === date && s.specCode === specCode);
                                if (slotIdx < entries.length && entries[slotIdx].name === input.value) {
                                    entries[slotIdx].name = '';
                                    refreshView();
                                }
                            }
                        }, 3000);
                    } else {
                        input.classList.remove('invalid-name');
                        input.classList.add('prefilled');
                        saveEntry(input);
                    }
                }
                if (g) g.innerHTML = "";
            }, 300);
        }

        // ================================================================
        // SAVE ENTRY
        // ================================================================
        function saveEntry(input) {
            const date = input.dataset.date;
            const specCode = input.dataset.spec;
            const slotIdx = parseInt(input.dataset.slot) || 0;
            const name = input.value.trim();
            
            if (!name) return;
            
            const validNames = nameData[specCode] || [];
            if (!validNames.some(n => n.toLowerCase() === name.toLowerCase())) {
                input.classList.add('invalid-name');
                input.classList.remove('prefilled', 'new-entry');
                showToast(`⚠️ "${name}" غير موجود`, 'error', 2000);
                setTimeout(() => {
                    if (input && input.classList.contains('invalid-name')) {
                        input.value = '';
                        input.classList.remove('invalid-name');
                        const entries = (db.schedule || []).filter(s => s.date === date && s.specCode === specCode);
                        if (slotIdx < entries.length && entries[slotIdx].name === name) {
                            entries[slotIdx].name = '';
                            refreshView();
                        }
                    }
                }, 2500);
                return;
            }
            
            const entries = (db.schedule || []).filter(s => s.date === date && s.specCode === specCode);
            if (slotIdx >= entries.length) {
                // Recalculate all times for the day (EQUAL DIVISION)
                const numSlots = entries.length + 1;
                const timeOverrides = {};
                entries.forEach((entry, idx) => {
                    if (entry.dutyTime) {
                        const parsed = parseDutyTime(entry.dutyTime);
                        if (parsed) timeOverrides[`slot_${idx}`] = parsed;
                    }
                });
                const calculatedTimes = calculateSlotTimes(numSlots, timeOverrides);
                const timeData = calculatedTimes[slotIdx] || { start: 0, end: 24 * 60 };
                const dutyTimeStr = formatDutyTime(timeData.start, timeData.end);
                
                db.schedule.push({
                    date: date,
                    specCode: specCode,
                    name: name,
                    VisitCount: 0,
                    dutyTime: dutyTimeStr,
                    dutySlot: slotIdx
                });
            } else {
                entries[slotIdx].name = name;
            }
            
            // Recalculate all times for the day (EQUAL DIVISION)
            const allEntries = (db.schedule || []).filter(s => s.date === date && s.specCode === specCode);
            const numSlots = allEntries.length;
            if (numSlots > 0) {
                const timeOverrides = {};
                allEntries.forEach((entry, idx) => {
                    if (entry.dutyTime) {
                        const parsed = parseDutyTime(entry.dutyTime);
                        if (parsed) timeOverrides[`slot_${idx}`] = parsed;
                    }
                });
                const calculatedTimes = calculateSlotTimes(numSlots, timeOverrides);
                allEntries.forEach((entry, idx) => {
                    const timeData = calculatedTimes[idx] || { start: 0, end: 24 * 60 };
                    entry.dutyTime = formatDutyTime(timeData.start, timeData.end);
                });
            }
            
            input.classList.remove('invalid-name', 'new-entry');
            input.classList.add('prefilled');
            refreshView();
        }

        // ================================================================
        // REFRESH VIEW
        // ================================================================
        let pendingFocusDate = null;
        let pendingFocusSpec = null;
        let pendingFocusSlot = null;
        let isRefreshing = false;  // Prevent blur handling during DOM rebuild
        
        function refreshView() {
            isRefreshing = true;  // Prevent blur handlers from interfering
            generateBoard();
            renderData();
            if (currentView === 'single') {
                const container = document.getElementById('board');
                const tracks = container.querySelectorAll('.specialty-track');
                tracks.forEach((track, index) => {
                    if (index === currentTrackIndex) {
                        track.classList.remove('hidden-track');
                        track.style.display = '';
                    } else {
                        track.classList.add('hidden-track');
                        track.style.display = 'none';
                    }
                });
            }
            updateIndicators();
            
            // Restore focus if pending
            if (pendingFocusDate && pendingFocusSpec !== null && pendingFocusSlot !== null) {
                setTimeout(() => {
                    const targetInput = document.querySelector(
                        `input[data-date="${pendingFocusDate}"][data-spec="${pendingFocusSpec}"][data-slot="${pendingFocusSlot}"]`
                    );
                    if (targetInput) {
                        targetInput.focus();
                        targetInput.select();
                        targetInput.scrollIntoView({ behavior: 'auto', block: 'center' });
                    }
                    pendingFocusDate = null;
                    pendingFocusSpec = null;
                    pendingFocusSlot = null;
                    isRefreshing = false;  // Done refreshing, allow blur handlers again
                }, 10);
            } else {
                isRefreshing = false;  // Done refreshing, allow blur handlers again
            }
        }

        // ================================================================
        // SAVE TO GITHUB
        // ================================================================
        async function saveToGithub() {
            const btn = document.getElementById('sync-btn');
            const oldText = btn.innerText;
            btn.innerText = "جاري...";

            const inputs = Array.from(document.querySelectorAll('.cell-input'));
            const dateSpecMap = {};
            
            inputs.forEach(input => {
                const date = input.dataset.date;
                const specCode = input.dataset.spec;
                const slotIdx = parseInt(input.dataset.slot) || 0;
                const name = input.value.trim();
                
                if (name && date && specCode) {
                    const key = `${date}-${specCode}`;
                    if (!dateSpecMap[key]) dateSpecMap[key] = [];
                    dateSpecMap[key][slotIdx] = name;
                }
            });
            
            const newSchedule = [];
            Object.keys(dateSpecMap).forEach(key => {
                const [date, specCode] = key.split('-');
                const names = dateSpecMap[key];
                names.forEach((name, idx) => {
                    if (name) {
                        const existing = (db.schedule || []).find(s => 
                            s.date === date && s.specCode === specCode && s.dutySlot === idx
                        );
                        newSchedule.push({
                            date: date,
                            specCode: specCode,
                            name: name,
                            VisitCount: existing?.VisitCount || 0,
                            dutyTime: existing?.dutyTime || formatDutyTime(idx * (24 * 60 / names.length), (idx + 1) * (24 * 60 / names.length)),
                            dutySlot: idx
                        });
                    }
                });
            });
            
            const picker = document.getElementById('month-picker');
            const [yr, mon] = picker.value.split('-');
            const preserved = (db.schedule || []).filter(s => 
                !s.date || !s.date.endsWith(`${mon}/${yr}`)
            );
            
            const updatedSchedule = [...preserved, ...newSchedule];
            
            try {
                const dataToSave = {
                    names: db.names || [],
                    schedule: updatedSchedule,
                    passwords: db.passwords || { user: "12345", admin: "123" },
                    specialties: db.specialties || []
                };

                const body = {
                    message: "Sync Schedule 🇮🇶",
                    content: btoa(unescape(encodeURIComponent(JSON.stringify(dataToSave, null, 2)))),
                    sha: fileSha
                };
                
                const res = await fetch(`https://api.github.com/repos/${CONFIG.user}/${CONFIG.repo}/contents/${CONFIG.path}`, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${GH_TOKEN}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(body)
                });
                
                if (res.ok) {
                    const update = await res.json();
                    fileSha = update.content.sha;
                    db.schedule = updatedSchedule;
                    btn.innerText = "✅ تم";
                    showToast('✅ تم حفظ الجدول', 'success');
                } else { 
                    btn.innerText = "❌ فشل";
                    showToast('❌ فشل حفظ الجدول', 'error');
                }
            } catch (e) { 
                btn.innerText = "⚠️ خطأ";
                showToast('❌ خطأ في الاتصال', 'error');
            }
            setTimeout(() => btn.innerText = oldText, 2000);
        }

        // ================================================================
        // TOAST
        // ================================================================
        let toastTimeout = null;

        function showToast(message, type = 'info', duration = 2500) {
            if (toastTimeout) {
                clearTimeout(toastTimeout);
                const existing = document.querySelector('.toast-container');
                if (existing) existing.remove();
            }
            
            const container = document.createElement('div');
            container.className = 'toast-container';
            container.style.background = type === 'success' ? '#10b981' : type === 'error' ? '#ef4444' : '#3b82f6';
            container.textContent = message;
            document.body.appendChild(container);
            
            toastTimeout = setTimeout(() => {
                container.style.opacity = '0';
                container.style.transform = 'translateX(-50%) translateY(-20px)';
                setTimeout(() => {
                    if (container.parentElement) container.remove();
                    toastTimeout = null;
                }, 300);
            }, duration);
        }

        // ================================================================
        // EXPOSE
        // ================================================================
        window.switchView = switchView;
        window.navigateTrack = navigateTrack;
        window.addSlot = addSlot;
        window.deleteSlot = deleteSlot;
        window.openTimePicker = openTimePicker;
        window.confirmTimePicker = confirmTimePicker;
        window.closeTimePicker = closeTimePicker;
        window.saveToGithub = saveToGithub;
        window.refreshView = refreshView;
        window.handleAC = handleAC;
        window.handleKeys = handleKeys;
        window.toggleMenu = toggleMenu;
        window.selectName = selectName;
        window.handleBlur = handleBlur;
        window.closeAllMenus = closeAllMenus;
        window.showToast = showToast;
    </script>
</body>
</html>
