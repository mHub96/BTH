<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Basra Teaching Hospital · Duty Roster 🇮🇶</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            direction: rtl;
            text-align: right;
            min-height: 100vh;
            padding: 0;
            transition: background 0.6s ease, color 0.4s ease;
            overflow-x: hidden;
        }

        /* ============================================================
           LIGHT THEME
        ============================================================ */
        body.light {
            background: #f2f6fc;
            color: #1a2332;
        }
        body.light .bg-surface {
            background: #ffffff;
        }
        body.light .bg-surface2 {
            background: #f8fafc;
        }
        body.light .text-primary {
            color: #1a2332;
        }
        body.light .text-secondary {
            color: #475569;
        }
        body.light .border-subtle {
            border-color: #e2e8f0;
        }
        body.light .glass-card {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        }
        body.light .lock-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        body.light .modal-card {
            background: #ffffff;
        }
        body.light .badge-spec {
            background: #dbeafe;
            color: #1e40af;
            font-weight: 700;
        }
        body.light .badge-active {
            background: #d1fae5;
            color: #065f46;
            font-weight: 700;
        }
        body.light .badge-reserve {
            background: #fef3c7;
            color: #92400e;
            font-weight: 700;
        }
        body.light .counter-badge {
            background: #dbeafe;
            color: #1e40af;
            border-color: #bfdbfe;
        }
        body.light .counter-badge i {
            color: #3b82f6;
        }
        body.light .toast-success { background: #10b981; color: white; }
        body.light .toast-error { background: #ef4444; color: white; }
        body.light .toast-info { background: #3b82f6; color: white; }
        body.light .resident-name {
            color: #1a2332 !important;
        }
        body.light .resident-phone {
            color: #475569 !important;
        }
        /* Light theme card - less greyish, more 3D extrusion */
        body.light .roster-card {
            background: rgba(248, 250, 252, 0.95);
            border-color: rgba(200, 210, 220, 0.4);
            box-shadow: 
                10px 10px 20px rgba(0, 0, 0, 0.06),
                -8px -8px 18px rgba(255, 255, 255, 0.8),
                0 4px 0 rgba(0, 0, 0, 0.03),
                0 8px 24px rgba(0, 0, 0, 0.02),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }
        body.light .roster-card:hover {
            border-color: #2563eb;
            box-shadow: 
                14px 14px 28px rgba(0, 0, 0, 0.08),
                -10px -10px 22px rgba(255, 255, 255, 0.9),
                0 6px 0 rgba(0, 0, 0, 0.03),
                0 12px 32px rgba(0, 0, 0, 0.03),
                inset 0 1px 0 rgba(255, 255, 255, 0.95);
            transform: translateY(-4px) scale(1.005);
        }
        body.light .roster-card:active {
            transform: translateY(4px) scale(0.97);
            box-shadow: 
                4px 4px 10px rgba(0, 0, 0, 0.04),
                -3px -3px 10px rgba(255, 255, 255, 0.5),
                0 1px 0 rgba(0, 0, 0, 0.01);
        }
        body.light .roster-card .resident-spec {
            background: #dbeafe;
            color: #1e40af;
            border-color: #bfdbfe;
        }
        body.light .roster-card .action-btn-sm {
            background: rgba(255, 255, 255, 0.7);
            box-shadow: 3px 3px 8px rgba(0, 0, 0, 0.04), -3px -3px 8px rgba(255, 255, 255, 0.7), 0 1px 0 rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        /* Light theme report button - better contrast */
        body.light .report-btn {
            background: #2563eb;
            border-color: #1d4ed8;
            color: white;
        }
        body.light .report-btn:hover {
            background: #1d4ed8;
            border-color: #1a4a8a;
            color: white;
        }

        /* ============================================================
           DARK THEME - Fixed contrast
        ============================================================ */
        body.dark {
            background: #0b0e12;
            color: #e8edf5;
        }
        body.dark::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0.08;
            background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23d4af37' fill-opacity='0.25'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            background-size: 120px 120px;
        }
        body.dark .bg-surface { background: #141a24; }
        body.dark .bg-surface2 { background: #0f151e; }
        body.dark .text-primary { color: #f0f3f8; }
        body.dark .text-secondary { color: #a8b3c9; }
        body.dark .border-subtle { border-color: #2a3346; }
        body.dark .glass-card {
            background: rgba(16, 22, 34, 0.82);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(212, 175, 55, 0.12);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }
        body.dark .badge-spec {
            background: rgba(212, 175, 55, 0.15);
            color: #d4af37;
            font-weight: 700;
        }
        body.dark .badge-active {
            background: rgba(16, 185, 129, 0.15);
            color: #6ee7b7;
            font-weight: 700;
        }
        body.dark .badge-reserve {
            background: rgba(251, 191, 36, 0.12);
            color: #fbbf24;
            font-weight: 700;
        }
        body.dark .counter-badge {
            background: rgba(212, 175, 55, 0.12);
            color: #d4af37;
            border-color: rgba(212, 175, 55, 0.15);
        }
        body.dark .counter-badge i {
            color: #d4af37;
        }
        body.dark .lock-card {
            background: rgba(12, 18, 30, 0.92);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.12);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        }
        body.dark .modal-card {
            background: #141c2a;
            border: 1px solid rgba(212, 175, 55, 0.08);
        }
        body.dark .btn-gradient {
            background: linear-gradient(135deg, #d4af37, #b8942e);
            box-shadow: 0 8px 24px rgba(212, 175, 55, 0.2);
            color: #0b0e12;
        }
        body.dark .btn-gradient:hover {
            box-shadow: 0 12px 32px rgba(212, 175, 55, 0.3);
        }
        body.dark .text-blue-600 { color: #d4af37 !important; }
        body.dark .text-blue-500 { color: #d4af37 !important; }
        body.dark .bg-blue-50 { background: rgba(212, 175, 55, 0.06) !important; }
        body.dark .bg-blue-100 { background: rgba(212, 175, 55, 0.10) !important; }
        body.dark .text-blue-700 { color: #d4af37 !important; }
        body.dark .border-blue-500 { border-color: rgba(212, 175, 55, 0.2) !important; }
        body.dark .shadow-blue-500\/30 { box-shadow: 0 8px 24px rgba(212, 175, 55, 0.15) !important; }
        body.dark .from-blue-500 { --tw-gradient-from: #d4af37 !important; }
        body.dark .to-blue-600 { --tw-gradient-to: #b8942e !important; }
        body.dark .bg-gradient-to-br { background-image: linear-gradient(to bottom right, #d4af37, #b8942e) !important; }
        body.dark .bg-blue-600 { background: #d4af37 !important; }
        body.dark .hover\:bg-blue-700:hover { background: #b8942e !important; }
        body.dark .text-white { color: #f0f3f8 !important; }
        body.dark .border-amber-200 { border-color: rgba(212, 175, 55, 0.2) !important; }
        body.dark .bg-amber-50 { background: rgba(212, 175, 55, 0.06) !important; }
        body.dark .text-amber-600 { color: #d4af37 !important; }
        body.dark .text-amber-700 { color: #d4af37 !important; }
        body.dark .bg-amber-100 { background: rgba(212, 175, 55, 0.10) !important; }
        body.dark .text-amber-500 { color: #d4af37 !important; }
        body.dark .bg-amber-500 { background: #d4af37 !important; }
        body.dark .from-amber-500 { --tw-gradient-from: #d4af37 !important; }
        body.dark .to-amber-600 { --tw-gradient-to: #b8942e !important; }
        body.dark .ring-amber-500 { --tw-ring-color: #d4af37 !important; }
        body.dark .shadow-amber-500\/20 { box-shadow: 0 8px 24px rgba(212, 175, 55, 0.15) !important; }
        body.dark .accent-amber-500 { accent-color: #d4af37 !important; }
        body.dark .toast-success { background: #10b981; color: white; }
        body.dark .toast-error { background: #ef4444; color: white; }
        body.dark .toast-info { background: #3b82f6; color: white; }
        
        /* Dark theme card embossing - dramatic 3D extrusion */
        body.dark .roster-card {
            background: rgba(14, 20, 32, 0.8);
            border-color: rgba(212, 175, 55, 0.06);
            box-shadow: 
                12px 12px 28px rgba(0, 0, 0, 0.7),
                -10px -10px 24px rgba(255, 255, 255, 0.02),
                0 5px 0 rgba(0, 0, 0, 0.5),
                0 0 50px rgba(212, 175, 55, 0.01),
                inset 0 1px 0 rgba(255, 255, 255, 0.02);
        }
        body.dark .roster-card:hover {
            border-color: rgba(212, 175, 55, 0.15);
            box-shadow: 
                16px 16px 36px rgba(0, 0, 0, 0.8),
                -12px -12px 28px rgba(255, 255, 255, 0.03),
                0 7px 0 rgba(0, 0, 0, 0.5),
                0 0 70px rgba(212, 175, 55, 0.04),
                0 0 100px rgba(212, 175, 55, 0.01),
                inset 0 1px 0 rgba(255, 255, 255, 0.03);
            transform: translateY(-5px) scale(1.01);
        }
        body.dark .roster-card:active {
            transform: translateY(5px) scale(0.97);
            box-shadow: 
                5px 5px 14px rgba(0, 0, 0, 0.4),
                -4px -4px 12px rgba(255, 255, 255, 0.01),
                0 1px 0 rgba(0, 0, 0, 0.2);
        }
        body.dark .roster-card .resident-spec {
            color: #d4af37 !important;
        }
        body.dark .roster-card .action-btn-sm {
            background: rgba(0, 0, 0, 0.35);
            box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.5), -3px -3px 8px rgba(255, 255, 255, 0.02), 0 1px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.02);
        }
        /* Dark theme report button */
        body.dark .report-btn {
            background: rgba(212, 175, 55, 0.08);
            border-color: rgba(212, 175, 55, 0.12);
            color: #d4af37;
        }
        body.dark .report-btn:hover {
            background: rgba(212, 175, 55, 0.12);
            border-color: rgba(212, 175, 55, 0.2);
            color: #d4af37;
        }

        /* FIXED: High contrast for resident names in dark mode */
        body.dark .resident-name {
            color: #f0f3f8 !important;
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.02);
        }
        body.dark .resident-phone {
            color: #a8b3c9 !important;
        }

        /* ============================================================
           SHARED STYLES
        ============================================================ */
        .glass-card {
            border-radius: 1.5rem;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .input-field {
            border-radius: 1rem;
            padding: 0.9rem 1.4rem;
            font-weight: 500;
            transition: all 0.3s ease;
            width: 100%;
            border: 2px solid;
            outline: none;
        }
        .input-field:focus {
            transform: translateY(-1px);
        }

        .btn-gradient {
            border: none;
            font-weight: 700;
            padding: 0.9rem 2rem;
            border-radius: 1.2rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.3);
        }
        .btn-gradient:hover {
            transform: translateY(-2px) scale(1.01);
        }
        .btn-gradient:active {
            transform: scale(0.97);
        }

        .btn-ghost {
            border-radius: 1.2rem;
            padding: 0.6rem 1.4rem;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid;
        }

        /* ============================================================
           ROSTER CARDS — CUBIC 3D EMBOSSED
        ============================================================ */
        .roster-card {
            border-radius: 1.4rem;
            padding: 1.3rem 1.6rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid;
            flex-wrap: wrap;
            gap: 0.5rem;
            position: relative;
            overflow: hidden;
            cursor: default;
        }
        /* 3D edge highlight - top */
        .roster-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 15%;
            right: 15%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
            pointer-events: none;
            opacity: 0.6;
            border-radius: 50%;
        }
        body.light .roster-card::before {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
            opacity: 0.8;
            height: 2px;
        }
        /* 3D edge shadow - bottom */
        .roster-card::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 5%;
            right: 5%;
            height: 4px;
            background: linear-gradient(90deg, transparent, rgba(0,0,0,0.08), transparent);
            pointer-events: none;
            filter: blur(3px);
        }
        body.light .roster-card::after {
            background: linear-gradient(90deg, transparent, rgba(0,0,0,0.12), transparent);
        }

        .roster-card .card-info {
            flex: 1;
            min-width: 140px;
        }
        .roster-card .card-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        /* 3D cubic buttons */
        .roster-card .action-btn-sm {
            padding: 0.5rem 0.9rem;
            border-radius: 0.9rem;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.7rem;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            transform: translateY(0);
        }
        body.light .roster-card .action-btn-sm:active {
            box-shadow: 1px 1px 4px rgba(0, 0, 0, 0.04), -1px -1px 4px rgba(255, 255, 255, 0.5);
        }
        body.dark .roster-card .action-btn-sm:active {
            box-shadow: 1px 1px 4px rgba(0, 0, 0, 0.3), -1px -1px 3px rgba(255, 255, 255, 0.01);
        }
        .roster-card .action-btn-sm:active {
            transform: translateY(3px) scale(0.95);
        }
        .roster-card .action-btn-sm.call {
            color: #2563eb;
        }
        body.dark .roster-card .action-btn-sm.call {
            color: #60a5fa;
        }
        .roster-card .action-btn-sm.call:hover {
            background: rgba(37, 99, 235, 0.08);
        }
        body.dark .roster-card .action-btn-sm.call:hover {
            background: rgba(96, 165, 250, 0.08);
        }
        .roster-card .action-btn-sm.wa {
            color: #059669;
        }
        body.dark .roster-card .action-btn-sm.wa {
            color: #34d399;
        }
        .roster-card .action-btn-sm.wa:hover {
            background: rgba(5, 150, 105, 0.08);
        }
        body.dark .roster-card .action-btn-sm.wa:hover {
            background: rgba(52, 211, 153, 0.08);
        }
        .roster-card .action-btn-sm.opacity-40 {
            opacity: 0.25;
            cursor: default;
            pointer-events: none;
        }

        .roster-card .resident-name {
            font-weight: 800;
            font-size: 1.1rem;
            transition: color 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .roster-card .resident-spec {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 0.1rem 0.6rem;
            border-radius: 100px;
            display: inline-block;
            border: 1px solid;
        }
        .roster-card .resident-phone {
            font-size: 0.8rem;
            font-weight: 600;
            font-family: monospace;
            direction: ltr;
            unicode-bidi: isolate;
            margin-top: 0.1rem;
            transition: color 0.3s ease;
        }

        .badge-spec, .badge-active, .badge-reserve {
            font-size: 0.6rem;
            padding: 0.15rem 0.7rem;
            border-radius: 100px;
            font-weight: 700;
            display: inline-block;
        }
        .counter-badge {
            font-size: 0.65rem;
            padding: 0.3rem 0.9rem;
            border-radius: 100px;
            font-weight: 700;
            display: inline-block;
            border: 1px solid;
            transition: all 0.3s ease;
        }

        /* Report Button - Global styles */
        .report-btn {
            border-radius: 1.2rem;
            padding: 0.6rem 1.8rem;
            font-size: 0.7rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid;
        }
        .report-btn:active {
            transform: scale(0.97);
        }

        .modal-overlay {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            position: fixed;
            inset: 0;
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s ease;
            padding: 1.5rem;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-card {
            max-width: 480px;
            width: 100%;
            border-radius: 2rem;
            padding: 2rem 2rem;
            transform: scale(0.95) translateY(20px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.2);
        }
        .modal-overlay.active .modal-card {
            transform: scale(1) translateY(0);
        }

        .lock-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
            position: relative;
            z-index: 2;
        }
        .lock-card {
            border-radius: 2.5rem;
            padding: 2.5rem 2.2rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.08);
        }
        .hidden-content {
            display: none;
        }
        .phone-ltr {
            direction: ltr;
            unicode-bidi: plaintext;
        }

        .btn-save {
            transition: all 0.4s ease;
            min-width: 120px;
        }
        .btn-save.loading {
            background: #3b82f6 !important;
            color: white !important;
            cursor: wait;
        }
        .btn-save.success {
            background: #10b981 !important;
            color: white !important;
        }
        .btn-save.error {
            background: #ef4444 !important;
            color: white !important;
        }
        body.dark .btn-save.loading {
            background: #d4af37 !important;
            color: #0b0e12 !important;
        }
        body.dark .btn-save.success {
            background: #10b981 !important;
            color: white !important;
        }
        body.dark .btn-save.error {
            background: #ef4444 !important;
            color: white !important;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 10px; }
        body.dark ::-webkit-scrollbar-thumb { background: #4a5568; }

        .lock-footer {
            margin-top: 1.5rem;
            font-size: 0.65rem;
            opacity: 0.4;
            text-align: center;
        }
        .footer-credit {
            font-size: 0.7rem;
            opacity: 0.5;
            padding: 0.8rem 0;
            text-align: center;
            border-top: 1px solid rgba(128, 128, 128, 0.1);
            margin-top: 2rem;
        }
        body.dark .footer-credit {
            border-top-color: rgba(212, 175, 55, 0.05);
        }

        .theme-toggle-wrap {
            perspective: 200px;
            display: inline-block;
        }
        .theme-toggle-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            transform-style: preserve-3d;
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(0, 0, 0, 0.1);
        }
        body.dark .theme-toggle-btn {
            background: rgba(212, 175, 55, 0.08);
            border-color: rgba(212, 175, 55, 0.2);
        }
        .theme-toggle-btn .icon-wrap {
            position: relative;

        #shield {

        #shield .shield-text {

        body.light #shield {
            background: #f2f6fc;
        }
        body.light #shield .shield-text {

        body.light #shield .shield-spinner {

        /* ============================================================
           SPECIALTY ICON STYLING

    <div id="main-content" class="hidden-content max-w-3xl mx-auto px-4 py-6 relative z-10">

    </div>

    <script>
        // ========== CONFIG ==========
        const CONFIG = { user: "mHub96", repo: "BTH", path: "data.json" };
        const _p = ["ghp_", "dAUtsFhTH", "a2KeJQO", "sxsCCt1v", "z8z1Z63Am", "sjS"];
        const GH_TOKEN = _p.join('');

        const arabicSpecs = {
            "MF": "جراحة الوجه و الفكين", "M": "الباطنية", "P": "النفسية", "G": "النسائية و التوليد",
            "GS": "الجراحة العامة", "US": "جراحة المسالك البولية",
            "ENT": "الأذن و الأنف و الحنجرة", "OR": "الكسور", "Pe": "الاطفال", "NM": "طب الجملة العصبية", "N": "طب امراض الكلى",
            "ICU": "تخدير العناية المركزة", "OP": "تخدير العمليات",
            "R": "الأشعة و السونار","O": "العيون", "D": "الوفيات"
        };

        const specIcons = {
            "GS": "🔪", "US": "🧬", "OR": "🦴", "ENT": "👂", "M": "💊", "Pe": "👶", "NM": "🧠", "N": "🧫",
            "O": "👁️", "ICU": "💉", "OP": "💉", "MF": "🦷", "R": "🩻", "G": "🌸", "P": "🧠", "D": "📋"
        };

        let db = { names: [], schedule: [] };
        let fileSha = "";
        let dataLoaded = false;
        let loadError = false;
        let isSessionRestored = false;
        let isLockScreenHidden = false;
        let isAutoLoginAttempted = false;

        const STORAGE_KEY = 'basra_roster_session';
        const SESSION_PIN = '1234';

        // ========== THEME ==========
        function toggleTheme() {
            document.getElementById('app-body').classList.toggle('light');
            document.getElementById('app-body').classList.toggle('dark');
            const isDark = document.getElementById('app-body').classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }
        if (localStorage.getItem('theme') === 'dark') {
            document.getElementById('app-body').classList.remove('light');
            document.getElementById('app-body').classList.add('dark');
        }

        // ========== TOAST ==========
        function showToast(message, type = 'info', duration = 3000) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                info: 'fa-info-circle'
            };
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `
                <i class="fas ${icons[type] || icons.info}"></i>
                <span>${message}</span>
                <button class="toast-close" onclick="this.parentElement.remove()">&times;</button>
            `;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.add('show'));
            setTimeout(() => {
                toast.classList.remove('show');
                toast.classList.add('hide');
                setTimeout(() => { if (toast.parentElement) toast.remove(); }, 500);
            }, duration);
        }

        // ========== SESSION ==========
        function saveSession() {
            const remember = document.getElementById('remember-me');
            if (remember && remember.checked) {
                localStorage.setItem(STORAGE_KEY, 'authenticated');
                localStorage.setItem(STORAGE_KEY + '_timestamp', Date.now().toString());
                localStorage.setItem('rememberMe', 'true');
            } else {
                localStorage.removeItem(STORAGE_KEY);
                localStorage.removeItem(STORAGE_KEY + '_timestamp');
                localStorage.removeItem('rememberMe');
            }
        }

        function checkSession() {
            const session = localStorage.getItem(STORAGE_KEY);
            if (!session) return false;
            const timestamp = localStorage.getItem(STORAGE_KEY + '_timestamp');
            if (timestamp) {
                const days = (Date.now() - parseInt(timestamp)) / (1000 * 60 * 60 * 24);
                if (days > 7) { clearSession(); return false; }
            }
            return session === 'authenticated';
        }

        function clearSession() {
            localStorage.removeItem(STORAGE_KEY);
            localStorage.removeItem(STORAGE_KEY + '_timestamp');
            localStorage.removeItem('rememberMe');
        }

        function logout() {
            clearSession();
            isSessionRestored = false;
            document.getElementById('lock-screen').style.display = 'flex';
            document.getElementById('main-content').classList.add('hidden-content');
            document.getElementById('password-input').value = '';
            document.getElementById('password-input').focus();
            showToast('تم تسجيل الخروج', 'info');
        }

        // ========== LOGIN ==========
        async function handleLogin() {
            const input = document.getElementById('password-input');
            const err = document.getElementById('lock-error');
            const pwd = input.value;

            if (!pwd) {
                err.innerText = '❌ الرجاء إدخال كلمة المرور';
                input.focus();
                setTimeout(() => err.innerText = '', 2500);
                return;
            }

            err.innerText = '⏳ جاري التحقق...';

            try {
                const res = await fetch(`https://api.github.com/repos/${CONFIG.user}/${CONFIG.repo}/contents/${CONFIG.path}?t=${Date.now()}`, {
                    headers: { "Authorization": `token ${GH_TOKEN}` }
                });

                if (res.ok) {
                    const data = await res.json();
                    fileSha = data.sha;
                    const content = JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\s/g, '')))));
                    db = content;
                    dataLoaded = true;
                    loginSuccess(content);
                } else {
                    err.innerText = '❌ خطأ في الاتصال بقاعدة البيانات';
                    setTimeout(() => err.innerText = '', 2500);
                }
            } catch (error) {
                console.error("Login error:", error);
                err.innerText = '❌ خطأ في الاتصال بقاعدة البيانات';
                setTimeout(() => err.innerText = '', 2500);
            }
        }

        function loginSuccess(content) {
            db = content;
            document.getElementById('lock-screen').style.display = 'none';
            document.getElementById('main-content').classList.remove('hidden-content');
            
            const remember = document.getElementById('remember-me');
            if (remember && remember.checked) {
                const pwd = document.getElementById('password-input').value;
                localStorage.setItem(STORAGE_KEY, 'authenticated');
                localStorage.setItem(STORAGE_KEY + '_timestamp', Date.now().toString());
                localStorage.setItem('rememberMe', 'true');
                localStorage.setItem('rememberToken', btoa(pwd));
            }
            
            renderRoster();
            showToast('تم تسجيل الدخول بنجاح', 'success');
        }

        // ========== AUTO LOGIN ==========
        (function() {
            const token = localStorage.getItem('rememberToken');
            const rememberMe = localStorage.getItem('rememberMe');
            if (token && rememberMe === 'true' && !isAutoLoginAttempted) {
                isAutoLoginAttempted = true;
                try {
                    const pwd = atob(token);
                    performAutoLogin(pwd);
                } catch (e) { console.error("Auto-login error:", e); }
            }
        })();

        async function performAutoLogin(pwd) {
            try {
                const res = await fetch(`https://api.github.com/repos/${CONFIG.user}/${CONFIG.repo}/contents/${CONFIG.path}?t=${Date.now()}`, {
                    headers: { "Authorization": `token ${GH_TOKEN}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    fileSha = data.sha;
                    const content = JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\s/g, '')))));
                    db = content;
                    dataLoaded = true;
                    document.getElementById('lock-screen').style.display = 'none';
                    document.getElementById('main-content').classList.remove('hidden-content');
                    renderRoster();
                    showToast('تم تسجيل الدخول تلقائياً', 'success');
                    return;
                }
            } catch (e) { console.error("Auto-login load error:", e); }
            document.getElementById('lock-screen').style.display = 'flex';
            document.getElementById('password-input').focus();
        }

        // ========== RENDER ==========
        function renderRoster() {
            const container = document.getElementById('roster-container');
            const targetDate = getMedicalDate();
            const now = new Date();
            const formattedDate = `${String(now.getDate()).padStart(2, '0')}-${now.toLocaleString('en-GB', {month:'short'})}-${now.getFullYear()}`;
            
            const todayEntries = db.schedule.filter(s => s.date === targetDate);
            
            // Update count
            const totalResidents = db.names.length;
            const activeCount = db.names.filter(n => n.spec !== "RESERVE").length;
            const onCallCount = todayEntries.length;
            document.getElementById('count-tag').innerHTML = 
                `<i class="fas fa-users mr-1"></i> ${totalResidents} مسجل · ${activeCount} نشط · ${onCallCount} في الخدمة`;

            if (todayEntries.length === 0) {
                container.innerHTML = `
                    <div class="glass-card p-8 text-center">
                        <div class="text-4xl mb-3 opacity-20">📭</div>
                        <div class="text-secondary/30 font-bold">لا يوجد مقيمين في الخدمة اليوم</div>
                    </div>
                `;
                return;
            }

            const sortedEntries = [...todayEntries].sort((a, b) => a.specCode.localeCompare(b.specCode));
            
            container.innerHTML = sortedEntries.map(entry => {
                const resident = db.names.find(n => n.name === entry.name);
                const phone = resident?.phone || "رقم غير متوفر";
                const specName = arabicSpecs[entry.specCode] || entry.specCode;
                const icon = specIcons[entry.specCode] || "🏥";
                const isPhoneValid = phone && phone !== "رقم غير متوفر" && phone.length > 5;
                
                return `
                    <div class="roster-card">
                        <div class="card-info">
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="resident-name text-embossed"><span class="spec-icon">${icon}</span> ${entry.name}</span>
                                <span class="resident-spec">${specName}</span>
                            </div>
                            <div class="resident-phone">${phone}</div>
                        </div>
                        <div class="card-actions">
                            <a href="${isPhoneValid ? 'tel:' + phone : '#'}" 
                               class="action-btn-sm call ${!isPhoneValid ? 'opacity-40' : ''}"
                               style="${!isPhoneValid ? 'cursor:default;' : ''}">
                                <i class="fas fa-phone"></i> Call
                            </a>
                            <a href="${isPhoneValid ? 'whatsapp://send?phone=' + phone : '#'}" 
                               class="action-btn-sm wa ${!isPhoneValid ? 'opacity-40' : ''}"
                               style="${!isPhoneValid ? 'cursor:default;' : ''}"
                               onclick="${isPhoneValid ? 'event.preventDefault(); window.location.href=this.href;' : 'event.preventDefault();'}">
                                <i class="fab fa-whatsapp"></i> WhatsApp
                            </a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function getMedicalDate() {
            const now = new Date();
            if (now.getHours() < 8) now.setDate(now.getDate() - 1);
            const d = String(now.getDate()).padStart(2, '0');
            const m = String(now.getMonth() + 1).padStart(2, '0');
            return `${d}/${m}/${now.getFullYear()}`;
        }

        function getFormattedDate() {
            const now = new Date();
            const d = String(now.getDate()).padStart(2, '0');
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const y = now.getFullYear();
            return `${d}/${m}/${y}`;
        }

        // ========== REPORT GENERATOR ==========
        function generateAndCopyReport() {
            const targetDate = getMedicalDate();
            const todayEntries = db.schedule.filter(s => s.date === targetDate);
            
            if (todayEntries.length === 0) {
                showToast('لا يوجد مقيمين في الخدمة اليوم لتوليد تقرير', 'error');
                return;
            }

            const sortedEntries = [...todayEntries].sort((a, b) => a.specCode.localeCompare(b.specCode));
            let report = '';
            let counter = 1;
            
            sortedEntries.forEach(entry => {
                const resident = db.names.find(n => n.name === entry.name);
                const phone = resident?.phone || "رقم غير متوفر";
                const specName = arabicSpecs[entry.specCode] || entry.specCode;
                report += `${counter}. ${specName}\n`;
                report += `   ${entry.name}\n`;
                report += `   ${phone}\n`;
                report += `   ${getFormattedDate()}\n\n`;
                counter++;
            });

            navigator.clipboard.writeText(report).then(() => {
                const btn = document.getElementById('report-btn');
                btn.innerHTML = '<i class="fas fa-check-circle"></i> Copied!';
                btn.style.borderColor = '#10b981';
                btn.style.color = '#10b981';
                setTimeout(() => {
                    btn.innerHTML = '<i class="fas fa-file-alt"></i> Generate & Copy Report';
                    btn.style.borderColor = '';
                    btn.style.color = '';
                }, 3000);
                showToast('تم نسخ التقرير إلى الحافظة', 'success');
            }).catch(() => {
                const textArea = document.createElement('textarea');
                textArea.value = report;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    const btn = document.getElementById('report-btn');
                    btn.innerHTML = '<i class="fas fa-check-circle"></i> Copied!';
                    btn.style.borderColor = '#10b981';
                    btn.style.color = '#10b981';
                    setTimeout(() => {
                        btn.innerHTML = '<i class="fas fa-file-alt"></i> Generate & Copy Report';
                        btn.style.borderColor = '';
                        btn.style.color = '';
                    }, 3000);
                    showToast('تم نسخ التقرير إلى الحافظة', 'success');
                } catch (err) {
                    showToast('فشل نسخ التقرير. حاول مرة أخرى.', 'error');
                }
                document.body.removeChild(textArea);
            });
        }

        // ========== LOADING ==========
        window.onload = async function() {
            const hasSession = checkSession();
            if (hasSession) {
                const token = localStorage.getItem('rememberToken');
                if (token) {
                    try {
                        const pwd = atob(token);
                        await performAutoLogin(pwd);
                    } catch (e) { /* fall through */ }
                }
            }

            if (document.getElementById('lock-screen').style.display !== 'none') {
                document.getElementById('password-input').focus();
            }

            if (!dataLoaded) {
                try {
                    const res = await fetch(`https://api.github.com/repos/${CONFIG.user}/${CONFIG.repo}/contents/${CONFIG.path}?t=${Date.now()}`, {
                        headers: { "Authorization": `token ${GH_TOKEN}` }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        fileSha = data.sha;
                        const content = JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\s/g, '')))));
                        db = content;
                        dataLoaded = true;
                        localStorage.setItem('duty_db_cache', JSON.stringify(db));
                    }
                } catch (e) {
                    console.warn('Data fetch failed:', e);
                    const cached = localStorage.getItem('duty_db_cache');
                    if (cached) {
                        try { db = JSON.parse(cached); dataLoaded = true; } catch (e2) {}
                    }
                }
            }

            setTimeout(() => {
                const s = document.getElementById('shield');
                if (s) { s.style.opacity = '0'; setTimeout(() => s.remove(), 500); }
            }, 800);

            if (dataLoaded && document.getElementById('lock-screen').style.display === 'none') {
                renderRoster();
            }
        };

        // ========== EVENT LISTENERS ==========
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const lockScreen = document.getElementById('lock-screen');
                if (lockScreen && lockScreen.style.display !== 'none') {
                    e.preventDefault();
                    handleLogin();
                }
            }
        });

        document.getElementById('remember-me').addEventListener('change', function() {
            if (!this.checked) {
                localStorage.removeItem('rememberToken');
                localStorage.removeItem('rememberMe');
            }
        });

        window.logout = logout;
        window.generateAndCopyReport = generateAndCopyReport;
        window.toggleTheme = toggleTheme;
    </script>
</body>
</html>
